<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>2026년 8월 과정 출국 안내</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
:root{
  --k:1.413;
  --accent:#0055a6; --deep:#002242; --soft:rgba(0,85,166,.08);
  --text:#0f172a; --dim:#475569; --faint:#8fa0b5; --line:#e2e8f0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#eef1f6;font-family:"Pretendard",-apple-system,"Malgun Gothic",sans-serif;
  color:var(--text);word-break:keep-all;-webkit-font-smoothing:antialiased;padding:24px 12px}
.sheet{width:794px;min-height:1123px;margin:0 auto;background:#fff;padding:32px 36px 26px;
  box-shadow:0 10px 40px rgba(15,23,42,.14);display:flex;flex-direction:column}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;
  border-bottom:3px solid var(--accent);padding-bottom:13px}
.top h1{font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.top h1 span{color:var(--accent)}
.top .sub{margin-top:6px;font-size:13px;color:var(--dim);font-weight:600}
.top .sub b{color:var(--text)}
.badge{flex:none;text-align:right}
.badge .n{font-size:29px;font-weight:800;color:var(--accent);line-height:1}
.badge .l{font-size:11px;color:var(--faint);font-weight:700;letter-spacing:.06em;margin-top:3px}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--k)*14px);margin-top:16px;align-items:start}
.grp{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:calc(var(--k)*14px)}
.grp-hd{background:var(--soft);padding:calc(var(--k)*10px) 13px;display:flex;align-items:center;gap:10px}
.no{flex:none;width:calc(var(--k)*23px);height:calc(var(--k)*23px);border-radius:50%;background:var(--accent);
  color:#fff;font-size:calc(var(--k)*12.5px);font-weight:800;display:flex;align-items:center;justify-content:center}
.hd-t{flex:1;min-width:0}
.hd-t .lbl{display:block;font-size:calc(var(--k)*10px);font-weight:800;color:var(--accent);letter-spacing:.08em}
.hd-t .time{display:block;white-space:nowrap;font-size:calc(var(--k)*19px);font-weight:800;letter-spacing:-.02em;color:var(--accent);
  font-variant-numeric:tabular-nums;line-height:1.2}
.cnt{flex:none;background:#fff;border:1px solid var(--line);color:var(--dim);font-size:calc(var(--k)*11px);
  font-weight:800;padding:3px 9px;border-radius:999px}

.fl{padding:calc(var(--k)*9px) 13px calc(var(--k)*11px)}
.fl+.fl{border-top:1px dashed var(--line)}
.fl-hd{font-size:calc(var(--k)*12.5px);font-weight:700;color:var(--dim);display:flex;gap:7px;align-items:baseline}
.fl-hd b{font-size:calc(var(--k)*14.5px);font-weight:800;color:var(--text);letter-spacing:-.01em}
.names{margin-top:calc(var(--k)*7px);display:grid;grid-template-columns:repeat(2,1fr);gap:calc(var(--k)*2px) 8px}
.names.wide{grid-template-columns:repeat(3,1fr)}
.names span{font-size:calc(var(--k)*13px);font-weight:600;padding:calc(var(--k)*2px) 0;white-space:nowrap}

.tip{margin-top:auto;border:1px solid #fde68a;background:#fffbeb;border-radius:10px;
  padding:10px 13px;font-size:11.5px;color:#92400e;font-weight:600;line-height:1.55}
.foot{margin-top:9px;font-size:10.5px;color:var(--faint);line-height:1.6;
  border-top:1px solid var(--line);padding-top:8px;display:flex;justify-content:space-between;gap:16px}

@page{size:A4;margin:10mm}
@media print{
  body{background:#fff;padding:0}
  .sheet{width:auto;min-height:auto;box-shadow:none;padding:0}
  .grp-hd,.tip{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="sheet">

  <div class="top">
    <div>
      <h1>2026년 8월 과정 <span>출국 안내</span></h1>
      <p class="sub"><b>8/28(금) ~ 8/30(일)</b> · 막탄 세부 공항 터미널 2 · 인솔 James
        &nbsp;|&nbsp; 굵은 시각 = <b>학교에서 버스 출발</b></p>
    </div>
    <div class="badge"><div class="n" id="total">0</div><div class="l">STUDENTS</div></div>
  </div>

  <div class="cols"><div id="colA"></div><div id="colB"></div></div>

  <div class="tip">
    버스 출발 시각까지 짐을 다 챙기고 <b>미리 나와 계세요.</b> 늦으면 버스가 기다리지 않습니다.
    항공편 시각은 현지(세부) 시각이며, 출발 날짜가 버스 타는 날의 <b>다음 날 새벽</b>인 조가 있으니 확인하세요.
  </div>
  <div class="foot">
    <span>변경 사항은 담당 선생님 공지를 따르세요.</span>
    <span style="text-align:right;white-space:nowrap">Lapulapu-Cebu International College</span>
  </div>
</div>

<script>
const GROUPS = [{"pick":"2026.08.28 22:00","pickDate":{"md":"8/28","wd":"금"},"pickTime":"22:00","staff":"James","flights":[{"no":"KE602","dep":"01:00","depDate":{"md":"8/29","wd":"토"},"term":"T2","names":["강지영","권지영","김가현","김시율","김윤지","김현중","박래은","전채은","정희윤","함채린"]}],"n":10},{"pick":"2026.08.28 23:00","pickDate":{"md":"8/28","wd":"금"},"pickTime":"23:00","staff":"James","flights":[{"no":"LJ32","dep":"02:20","depDate":{"md":"8/29","wd":"토"},"term":"T2","names":["강하은","김보빈","노지윤","송채현","송혜림","여승우","이다원","임여진","전우진","정해린"]}],"n":10},{"pick":"2026.08.29 11:30","pickDate":{"md":"8/29","wd":"토"},"pickTime":"11:30","staff":"James","flights":[{"no":"FY3693","dep":"14:30","depDate":{"md":"8/29","wd":"토"},"term":"T2","names":["김나윤"]},{"no":"5J130","dep":"14:50","depDate":{"md":"8/29","wd":"토"},"term":"T2","names":["김시윤","임예진"]}],"n":3},{"pick":"2026.08.29 22:00","pickDate":{"md":"8/29","wd":"토"},"pickTime":"22:00","staff":"James","flights":[{"no":"KE602","dep":"01:00","depDate":{"md":"8/30","wd":"일"},"term":"T2","names":["성희찬","최인서"]},{"no":"7C2114","dep":"01:45","depDate":{"md":"8/30","wd":"일"},"term":"T2","names":["김이현","박시현","유수연"]}],"n":5},{"pick":"2026.08.29 23:20","pickDate":{"md":"8/29","wd":"토"},"pickTime":"23:20","staff":"James","flights":[{"no":"LJ32","dep":"02:20","depDate":{"md":"8/30","wd":"일"},"term":"T2","names":["김경민","김다혜","김민서","김서우","김승하","김이빈","김준원","문시원","민수인","박소은","서은정","유경민","유승완","유준용","윤서영","이경택","이선재","정진아","정태호","정휘성","최연우","최은서","추재석","한지호","황준상"]}],"n":25}];
document.getElementById("total").textContent =
  GROUPS.reduce((s,g)=>s+g.n,0);

const card = (g,i)=>`
  <div class="grp">
    <div class="grp-hd">
      <span class="no">${i+1}</span>
      <span class="hd-t">
        <span class="lbl">버스 출발</span>
        <span class="time">${g.pickDate.md}(${g.pickDate.wd}) ${g.pickTime}</span>
      </span>
      <span class="cnt">${g.n}명</span>
    </div>
    ${g.flights.map(f=>`<div class="fl">
      <div class="fl-hd"><b>${f.no}</b>
        <span>${f.depDate.md}(${f.depDate.wd}) ${f.dep} 출발 · ${f.term} · ${f.names.length}명</span></div>
      <div class="names${f.names.length>12?" wide":""}">${f.names.map(n=>`<span>${n}</span>`).join("")}</div>
    </div>`).join("")}
  </div>`;

// 왼쪽: 1~3조 / 오른쪽: 4~5조 (인원이 균형 잡히도록)
document.getElementById("colA").innerHTML = GROUPS.slice(0,3).map((g,i)=>card(g,i)).join("");
document.getElementById("colB").innerHTML = GROUPS.slice(3).map((g,i)=>card(g,i+3)).join("");
</script>
</body>
</html>
