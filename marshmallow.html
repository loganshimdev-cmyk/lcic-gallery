<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>마시멜로우 챌린지 신청자 · LCIC</title>
<link rel="icon" type="image/png" href="assets/brand/lcic-logo.png">
<script src="assets/background.js?v=8"></script>
<link rel="stylesheet" href="assets/shared.css?v=13">
<script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
<style>
  .gate { max-width: 400px; margin: 90px auto 0; padding: 36px 32px; background: var(--bg-elev);
    border: 1px solid var(--hairline); border-radius: 24px; box-shadow: var(--shadow-lg); }
  .gate h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 6px; }
  .gate p { color: var(--text-dim); font-size: .85rem; margin-bottom: 20px; }
  .gate input { width: 100%; margin-bottom: 12px; }

  .wrap { max-width: 820px; margin: 0 auto; padding: 32px 20px 100px; }
  .head h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -.02em; }
  .head .meta { color: var(--text-dim); font-size: .84rem; margin-top: 3px; }

  .count-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 16px 0 8px; }
  .count-bar .cbx { display: inline-flex; align-items: baseline; gap: 7px; padding: 10px 16px; border-radius: 12px;
    background: var(--bg-elev); border: 1px solid var(--hairline); font-size: .88rem; font-weight: 700; box-shadow: var(--shadow-sm); }
  .count-bar .cbx .n { font-weight: 800; font-size: 1.15rem; color: #be185d; }
  .msm-bar { height: 10px; border-radius: 99px; background: var(--hairline); overflow: hidden; margin: 0 0 8px; }
  .msm-fill { height: 100%; width: 0; background: linear-gradient(90deg,#f472b6,#ec4899); transition: width .4s; }
  .hint { font-size: .78rem; color: var(--text-faint); margin: 0 0 18px; line-height: 1.5; }
  .search { margin: 0 0 20px; }
  .search input { max-width: 300px; }

  .names { display: flex; flex-wrap: wrap; gap: 9px; }
  .nm { display: inline-flex; align-items: baseline; gap: 6px; padding: 9px 14px; border-radius: 12px;
    background: rgba(219,39,119,0.08); border: 1px solid rgba(219,39,119,0.22); font-size: .95rem; }
  .nm .no { font-size: .72rem; color: var(--text-faint); font-weight: 700; }
  .nm b { font-weight: 700; color: #be185d; }
  .nm .uni { font-size: .7rem; color: var(--text-faint); }
  .nm.hit { box-shadow: 0 0 0 2px rgba(219,39,119,.6); }
  .empty { color: var(--text-faint); text-align: center; padding: 48px 20px; line-height: 1.6; }
</style>
</head>
<body>

<div id="gate-view">
  <div class="gate">
    <h2>🍭 마시멜로우 챌린지 신청자</h2>
    <p>담당자 전용입니다. 비밀번호를 입력하세요.</p>
    <form id="gate-form">
      <input class="input" id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" required>
      <button class="btn-primary" id="gate-btn" type="submit" style="width:100%;">열기</button>
    </form>
  </div>
</div>

<main id="app-view" class="wrap hidden">
  <div class="head">
    <h1>🍭 마시멜로우 챌린지 신청자</h1>
    <div class="meta">7월 14일(화) 오후 4시 · 어학관 2층 · 선착순 50명 · 신청 오픈 7/8(수) 10시 5분 · 마감 7/9(목) 12시</div>
  </div>
  <div class="count-bar" id="counts"></div>
  <div class="msm-bar"><div class="msm-fill" id="fill"></div></div>
  <div class="hint">학생이 <b>status.html(학생 안내)</b>에서 신청/취소합니다. 15초마다 자동 갱신됩니다.</div>
  <div class="search"><input class="input" id="q" type="search" placeholder="이름 검색"></div>
  <div id="list"></div>
</main>

<div class="toast" id="toast"></div>

<script type="module">
import { supabase } from "./assets/supabase.js?v=4";

const $ = (id) => document.getElementById(id);
const toast = $("toast");
function showToast(m, t = "") { toast.textContent = m; toast.className = `toast show ${t}`; setTimeout(() => toast.classList.remove("show"), 2600); }
const esc = (s) => (s == null ? "" : String(s)).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

const PW = "8686";
const CAP = 50;
let ROWS = [];
let ready = false;

$("gate-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if ($("pw").value !== PW) { showToast("비밀번호가 올바르지 않습니다.", "error"); return; }
  $("gate-view").classList.add("hidden");
  $("app-view").classList.remove("hidden");
  await load();
  render();
  setInterval(sync, 15000);
});

async function load() {
  try {
    const { data, error } = await supabase.from("marshmallow_signups").select("id,name,university,created_at");
    if (error) throw error;
    ROWS = data || [];
    ready = true;
  } catch (_) {
    ready = false; ROWS = [];
    showToast("명단을 불러오지 못했습니다(관리자 SQL 필요).", "error");
  }
}
async function sync() {
  if (!ready) return;
  try {
    const { data, error } = await supabase.from("marshmallow_signups").select("id,name,university,created_at");
    if (error) throw error;
    ROWS = data || [];
    render();
  } catch (_) { /* 일시적 오류는 조용히 무시 */ }
}

$("q").addEventListener("input", render);

function render() {
  const q = ($("q").value || "").trim();
  const total = ROWS.length;
  const full = total >= CAP;

  $("counts").innerHTML =
    `<span class="cbx">신청 <span class="n">${total}</span>/${CAP}명</span>` +
    (full ? `<span class="cbx" style="color:#b91c1c">정원 마감</span>` : `<span class="cbx" style="opacity:.75">남은 자리 ${Math.max(0, CAP - total)}</span>`);
  $("fill").style.width = Math.min(100, Math.round(total / CAP * 100)) + "%";

  if (!total) {
    $("list").innerHTML = `<div class="empty">아직 신청자가 없습니다.<br>학생이 학생 안내 페이지에서 신청하면 여기에 표시됩니다.</div>`;
    return;
  }

  const rows = ROWS.slice().sort((a, b) => String(a.created_at || "").localeCompare(String(b.created_at || "")));   // 신청 순
  const shown = rows.filter((r) => !q || String(r.name || "").includes(q));
  $("list").innerHTML = shown.length
    ? `<div class="names">${shown.map((r, i) => `<span class="nm${q ? " hit" : ""}"><span class="no">${i + 1}</span><b>${esc(r.name)}</b>${r.university ? `<span class="uni">${esc(r.university)}</span>` : ""}</span>`).join("")}</div>`
    : `<div class="empty">검색 결과가 없습니다.</div>`;
}
</script>
</body>
</html>
