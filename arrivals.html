<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>도착 · 기숙사 입소 명단 · LCIC</title>
<link rel="icon" type="image/png" href="assets/brand/lcic-logo.png">
<script src="assets/background.js?v=8"></script>
<link rel="stylesheet" href="assets/shared.css?v=13">
<script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
<style>
  .gate { max-width: 400px; margin: 90px auto 0; padding: 36px 32px; background: var(--bg-elev);
    border: 1px solid var(--hairline); border-radius: 24px; box-shadow: var(--shadow-lg); }
  .gate h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 6px; }
  .gate p { color: var(--text-dim); font-size: .85rem; margin-bottom: 20px; }
  .gate input { width: 100%; margin-bottom: 12px; }

  .wrap { max-width: 1000px; margin: 0 auto; padding: 32px 20px 100px; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
  .head h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -.02em; }
  .head .meta { color: var(--text-dim); font-size: .84rem; margin-top: 3px; }
  .search { margin: 16px 0 24px; }
  .search input { max-width: 300px; }

  .sec { margin-bottom: 34px; }
  .sec-head { display: flex; align-items: center; gap: 10px; font-size: 1.15rem; font-weight: 800;
    padding: 12px 16px; border-radius: 14px; background: var(--accent-tint); color: var(--accent-deep);
    border: 1px solid var(--accent-soft); margin-bottom: 16px; }
  .sec-head .cnt { margin-left: auto; font-size: .9rem; font-weight: 700; color: var(--text-dim); }

  .flt { border: 1px solid var(--hairline); border-radius: 16px; margin-bottom: 14px; overflow: hidden; background: var(--bg-elev); box-shadow: var(--shadow-sm); }
  .flt-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 13px 16px; background: rgba(0,0,0,.025); border-bottom: 1px solid var(--hairline); }
  .flt-no { font-weight: 800; font-size: 1rem; letter-spacing: .01em; }
  .flt-when { color: var(--text-dim); font-size: .84rem; }
  .flt-cnt { margin-left: auto; font-size: .82rem; font-weight: 700; color: var(--accent-deep); }
  .sec-head.dep { color: #b91c1c; }
  .pickup-chip { font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  .selfb { font-size: .68rem; font-weight: 800; padding: 2px 7px; border-radius: 999px;
    background: #fef3c7; color: #92400e; margin-left: 4px; }
  .nmd { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; margin: 3px;
    border-radius: 10px; background: #fff; border: 1px solid var(--hairline); font-size: .9rem; }
  .nmd .uni { font-size: .72rem; color: var(--text-dim); }
  .carry { font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    background: rgba(217,119,6,.12); color: #b45309; white-space: nowrap; }
  .names { display: flex; flex-wrap: wrap; gap: 8px; padding: 15px 16px; }
  .nm { display: inline-flex; align-items: baseline; gap: 5px; padding: 6px 11px; border-radius: 10px;
    background: rgba(0,0,0,.035); border: 1px solid var(--hairline); font-size: .9rem;
    cursor: pointer; user-select: none; transition: background .12s, border-color .12s; }
  .nm:hover { border-color: var(--accent); }
  .nm b { font-weight: 700; }
  .nm .uni { font-size: .68rem; color: var(--text-faint); }
  .nm .st { font-size: .72rem; font-weight: 800; white-space: nowrap; }
  .nm.st-airport { background: rgba(0,85,166,.13); border-color: rgba(0,85,166,.45); }
  .nm.st-airport .st { color: var(--accent-deep); }
  .nm.st-dorm { background: rgba(5,150,105,.16); border-color: rgba(5,150,105,.5); }
  .nm.st-dorm .st { color: #047857; }
  .nm.hit { box-shadow: 0 0 0 2px rgba(202,138,4,.75); }

  .count-bar { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 12px; }
  .count-bar .cbx { display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px; border-radius: 12px;
    background: var(--bg-elev); border: 1px solid var(--hairline); font-size: .86rem; font-weight: 700; box-shadow: var(--shadow-sm); }
  .count-bar .cbx .n { font-weight: 800; font-size: 1.02rem; }
  .count-bar .cbx.air .n { color: var(--accent-deep); }
  .count-bar .cbx.dorm .n { color: #047857; }
  .vtabs { display: flex; gap: 8px; margin: 0 0 14px; }
  .vtabs button { flex: 1; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--hairline);
    background: var(--bg-elev); font-size: .95rem; font-weight: 800; cursor: pointer; box-shadow: var(--shadow-sm); }
  .vtabs button.act-arr { background: var(--accent-deep); color: #fff; border-color: var(--accent-deep); }
  .vtabs button.act-dep { background: #b91c1c; color: #fff; border-color: #b91c1c; }
  .nmd { cursor: pointer; user-select: none; }
  .nmd.st-done { background: #ecfdf5; border-color: #6ee7b7; }
  .nmd .st { font-size: .72rem; font-weight: 800; color: #047857; }
  .hint { font-size: .78rem; color: var(--text-faint); margin: 0 0 18px; line-height: 1.5; }
  .empty { color: var(--text-faint); text-align: center; padding: 40px; }
</style>
</head>
<body>

<div id="gate-view">
  <div class="gate">
    <h2><iconify-icon icon="solar:plain-2-bold-duotone" inline></iconify-icon> 도착 · 입소 명단</h2>
    <p>담당자 전용입니다. 비밀번호를 입력하세요.</p>
    <form id="gate-form">
      <input class="input" id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" required>
      <button class="btn-primary" id="gate-btn" type="submit" style="width:100%;">열기</button>
    </form>
  </div>
</div>

<main id="app-view" class="wrap hidden">
  <div class="head">
    <div>
      <h1>🛬 도착 · 기숙사 입소 명단</h1>
      <div class="meta" id="meta"></div>
    </div>
  </div>
  <div class="vtabs">
    <button id="tab-arr" type="button">🏠 오는 학생 (입소)</button>
    <button id="tab-dep" type="button">🛫 가는 학생 (출국)</button>
  </div>
  <div class="count-bar" id="counts"></div>
  <div class="hint" id="hint">이름을 누르면 <b style="color:var(--accent-deep);">🛬 공항 도착</b> → <b style="color:#047857;">🏠 기숙사 도착</b> → 해제 순서로 바뀝니다. 담당자 모두에게 공유됩니다.</div>
  <div class="search"><input class="input" id="q" type="search" placeholder="이름 검색"></div>
  <div id="list"></div>
</main>

<div class="toast" id="toast"></div>

<script type="module">
import { supabase } from "./assets/supabase.js?v=4";

const $ = (id) => document.getElementById(id);
const toast = $("toast");
function showToast(m, t = "") { toast.textContent = m; toast.className = `toast show ${t}`; setTimeout(() => toast.classList.remove("show"), 2600); }
const esc = (s) => (s == null ? "" : String(s)).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const WD = ["일", "월", "화", "수", "목", "금", "토"];
function fmtDorm(iso) { const [y, m, d] = iso.split("-").map(Number); const wd = WD[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]; return `${m}월 ${d}일 (${wd})`; }
function fmtDep(iso, tm) { const [y, m, d] = iso.split("-").map(Number); const wd = WD[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]; return `세부 ${m}/${d}(${wd}) ${tm || ""} 출발`.replace(/\s+출발/, " 출발"); }
function fmtArr(iso, t) { const [y, m, d] = iso.split("-").map(Number); const wd = WD[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]; return `세부 ${m}/${d}(${wd}) ${t || ""} 도착`.replace(/\s+도착/, " 도착"); }

async function decryptBlob(b64, password) {
  const raw = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  const salt = raw.slice(0, 16), iv = raw.slice(16, 28), tag = raw.slice(28, 44), ct = raw.slice(44);
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const data = new Uint8Array(ct.length + tag.length); data.set(ct); data.set(tag, ct.length);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
  return JSON.parse(new TextDecoder().decode(pt));
}

let DATA = null;
let CHECK = new Map();          // id -> 'airport' | 'dorm'
let checkinReady = false;
const TABLE = "arrival_checkins";

$("gate-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("gate-btn"); btn.disabled = true; btn.textContent = "여는 중…";
  try {
    DATA = await decryptBlob(window.ARRIVALS_BLOB, $("pw").value);
    DATA.updated = DATA.updated || window.ARRIVALS_UPDATED;
    $("gate-view").classList.add("hidden");
    $("app-view").classList.remove("hidden");
    await loadCheckins();
    setTab(TAB);
    setInterval(syncCheckins, 15000);   // 팀 공유: 15초마다 동기화
  } catch (_) {
    btn.disabled = false; btn.textContent = "열기";
    showToast("비밀번호가 올바르지 않습니다.", "error");
  }
});

async function loadCheckins() {
  try {
    const { data, error } = await supabase.from(TABLE).select("id,status");
    if (error) throw error;
    CHECK = new Map((data || []).map((r) => [r.id, r.status]));
    checkinReady = true;
  } catch (_) {
    checkinReady = false; CHECK = new Map();
    showToast("체크인 동기화가 아직 준비되지 않았습니다(관리자 SQL 필요).", "error");
  }
}

// 15초마다 최신 상태를 받아 바뀐 칩만 갱신(전체 다시 그리지 않아 스크롤 유지)
async function syncCheckins() {
  if (!checkinReady) return;
  try {
    const { data, error } = await supabase.from(TABLE).select("id,status");
    if (error) throw error;
    CHECK = new Map((data || []).map((r) => [r.id, r.status]));
    applyAllStates();
  } catch (_) { /* 일시적 오류는 조용히 무시 */ }
}

let TAB = localStorage.getItem("lcic-arrivals-tab") || "arr";
function setTab(tab) {
  TAB = tab; localStorage.setItem("lcic-arrivals-tab", tab);
  $("tab-arr").className = tab === "arr" ? "act-arr" : "";
  $("tab-dep").className = tab === "dep" ? "act-dep" : "";
  $("hint").innerHTML = tab === "arr"
    ? `이름을 누르면 <b style="color:var(--accent-deep);">🛬 공항 도착</b> → <b style="color:#047857;">🏠 기숙사 도착</b> → 해제 순서로 바뀝니다. 담당자 모두에게 공유됩니다.`
    : `이름을 누르면 <b style="color:#047857;">✅ 체크</b> ↔ 해제로 바뀝니다. 담당자 모두에게 공유됩니다.`;
  render();
}
$("tab-arr").addEventListener("click", () => setTab("arr"));
$("tab-dep").addEventListener("click", () => setTab("dep"));

$("q").addEventListener("input", render);

const stateOf = (id) => CHECK.get(id);
const badge = (s) => (s === "airport" ? "🛬 공항" : s === "dorm" ? "🏠 기숙사" : "");
function applyChip(el, status) {
  el.classList.remove("st-airport", "st-dorm");
  if (status === "airport") el.classList.add("st-airport");
  else if (status === "dorm") el.classList.add("st-dorm");
  const st = el.querySelector(".st"); if (st) st.textContent = badge(status);
}
function applyDepChip(el, checked) {
  el.classList.toggle("st-done", !!checked);
  const st = el.querySelector(".st"); if (st) st.textContent = checked ? "✅ 체크" : "";
}
function applyAllStates() {
  document.querySelectorAll("#list .nm").forEach((el) => applyChip(el, stateOf(el.dataset.id)));
  document.querySelectorAll("#list .nmd").forEach((el) => applyDepChip(el, CHECK.has("dep_" + el.dataset.id)));
  updateCounts();
}
function updateCounts() {
  if (TAB === "dep") {
    const grand = (DATA.departs || []).reduce((a, s) => a + s.count, 0);
    const done = [...CHECK.keys()].filter((k) => k.startsWith("dep_")).length;
    $("counts").innerHTML =
      `<span class="cbx dorm">✅ 체크됨 <span class="n">${done}</span></span>` +
      `<span class="cbx" style="opacity:.7">미체크 <span class="n">${grand - done}</span></span>` +
      `<span class="cbx" style="opacity:.7">전체 <span class="n">${grand}</span></span>`;
    return;
  }
  const grand = DATA.sections.reduce((a, s) => a + s.count, 0);
  const air = [...CHECK.entries()].filter(([k, v]) => !k.startsWith("dep_") && (v === "airport" || v === "dorm")).length;
  const dorm = [...CHECK.entries()].filter(([k, v]) => !k.startsWith("dep_") && v === "dorm").length;
  $("counts").innerHTML =
    `<span class="cbx air">🛬 공항 도착 <span class="n">${air}</span></span>` +
    `<span class="cbx dorm">🏠 기숙사 도착 <span class="n">${dorm}</span></span>` +
    `<span class="cbx" style="opacity:.7">전체 <span class="n">${grand}</span></span>`;
}

async function onClickName(el) {
  if (!checkinReady) { showToast("체크인 기능이 아직 켜지지 않았습니다(관리자 SQL 필요).", "error"); return; }
  const id = el.dataset.id;
  const cur = stateOf(id);
  const next = cur === undefined ? "airport" : cur === "airport" ? "dorm" : undefined;
  if (next) CHECK.set(id, next); else CHECK.delete(id);   // 낙관적 업데이트
  applyChip(el, next); updateCounts();
  try {
    const res = next
      ? await supabase.from(TABLE).upsert({ id, status: next, updated_at: new Date().toISOString() })
      : await supabase.from(TABLE).delete().eq("id", id);
    if (res.error) throw res.error;
  } catch (_) {
    if (cur) CHECK.set(id, cur); else CHECK.delete(id);   // 롤백
    applyChip(el, cur); updateCounts();
    showToast("저장 실패 — 다시 시도해 주세요.", "error");
  }
}

async function onClickDepName(el) {
  if (!checkinReady) { showToast("체크 기능이 아직 켜지지 않았습니다(관리자 SQL 필요).", "error"); return; }
  const id = "dep_" + el.dataset.id;
  const cur = CHECK.has(id);
  if (cur) CHECK.delete(id); else CHECK.set(id, "dorm");   // 낙관적 업데이트 (제약상 'dorm' 값 재사용, dep_ 접두사로 구분)
  applyDepChip(el, !cur); updateCounts();
  try {
    const res = !cur
      ? await supabase.from(TABLE).upsert({ id, status: "dorm", updated_at: new Date().toISOString() })
      : await supabase.from(TABLE).delete().eq("id", id);
    if (res.error) throw res.error;
  } catch (_) {
    if (cur) CHECK.set(id, "dorm"); else CHECK.delete(id);  // 롤백
    applyDepChip(el, cur); updateCounts();
    showToast("저장 실패 — 다시 시도해 주세요.", "error");
  }
}

$("list").addEventListener("click", (e) => {
  const el = e.target.closest(".nm"); if (el) { onClickName(el); return; }
  const dl = e.target.closest(".nmd"); if (dl) onClickDepName(dl);
});

function render() {
  const q = ($("q").value || "").trim();
  const grand = DATA.sections.reduce((a, s) => a + s.count, 0);
  const depGrand = (DATA.departs || []).reduce((a, s) => a + s.count, 0);
  $("meta").textContent = `입소 ${grand}명 · 출국 ${depGrand}명 · 비행기편별 · 가나다순${DATA.updated ? " · 갱신 " + DATA.updated : ""}`;

  let html = "";
  for (const s of (TAB === "arr" ? DATA.sections : [])) {
    let secHtml = "", secShown = 0;
    for (const f of s.flights) {
      const items = f.students.map((st) => {
        if (q && !st.n.includes(q)) return null;
        return `<span class="nm${q ? " hit" : ""}" data-id="${esc(st.id)}"><b>${esc(st.n)}</b>${st.u ? `<span class="uni">${esc(st.u)}</span>` : ""}<span class="st"></span></span>`;
      }).filter(Boolean);
      if (!items.length) continue;
      secShown += items.length;
      secHtml += `<div class="flt">
        <div class="flt-head">
          <span class="flt-no">✈️ ${esc(f.flightNo)}</span>
          <span class="flt-when">${esc(fmtArr(f.arrDate, f.arrTime))}</span>
          ${f.carry ? `<span class="carry">전날 밤 → 익일 새벽 입소</span>` : ""}
          <span class="flt-cnt">${f.students.length}명</span>
        </div>
        <div class="names">${items.join("")}</div>
      </div>`;
    }
    if (!secShown) continue;
    html += `<div class="sec">
      <div class="sec-head"><iconify-icon icon="solar:home-2-bold-duotone"></iconify-icon> ${fmtDorm(s.dorm)} 기숙사 입소
        <span class="cnt">${q ? secShown + " / " : ""}${s.count}명</span></div>
      ${secHtml}</div>`;
  }
  // ── 🛫 7월 과정 귀국(출국) — 출국일별, 클릭 체크인 없음(출국 관리는 OneSheet) ──
  for (const s of (TAB === "dep" ? DATA.departs || [] : [])) {
    let secHtml = "", secShown = 0;
    for (const f of s.flights) {
      const items = f.students.map((st) => {
        if (q && !st.n.includes(q)) return null;
        return `<span class="nmd${q ? " hit" : ""}" data-id="${esc(st.id)}"><b>${esc(st.n)}</b>${st.u ? `<span class="uni">${esc(st.u)}</span>` : ""}${st.self ? `<span class="selfb">개별이동</span>` : ""}${st.pk ? `<span class="selfb" style="background:#fee2e2;color:#b91c1c;">🚌 ${esc(st.pk)}</span>` : ""}<span class="st"></span></span>`;
      }).filter(Boolean);
      if (!items.length) continue;
      secShown += items.length;
      const pk = f.pickup ? (() => { const [d, tm] = f.pickup.split(" "); const [y, m, dd] = d.split("-").map(Number); const wd = WD[new Date(Date.UTC(y, m - 1, dd)).getUTCDay()]; return `${m}/${dd}(${wd}) ${tm} 정문 출발`; })() : "";
      secHtml += `<div class="flt">
        <div class="flt-head">
          <span class="flt-no">🛫 ${esc(f.flightNo)}</span>
          <span class="flt-when">${esc(fmtDep(f.depDate, f.depTime))}</span>
          ${pk ? `<span class="pickup-chip">🚌 ${esc(pk)}</span>` : ""}
          <span class="flt-cnt">${f.students.length}명</span>
        </div>
        <div class="names">${items.join("")}</div>
      </div>`;
    }
    if (!secShown) continue;
    html += `<div class="sec">
      <div class="sec-head dep"><iconify-icon icon="solar:plain-3-bold-duotone"></iconify-icon> ${fmtDorm(s.day)} 출국 (7월 과정 귀국)
        <span class="cnt">${q ? secShown + " / " : ""}${s.count}명</span></div>
      ${secHtml}</div>`;
  }

  $("list").innerHTML = html || `<div class="empty">검색 결과가 없습니다.</div>`;
  applyAllStates();
}
</script>
</body>
