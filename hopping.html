<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>호핑 투어 수요조사 · LCIC</title>
<link rel="icon" type="image/png" href="assets/brand/lcic-logo.png">
<script src="assets/background.js?v=8"></script>
<link rel="stylesheet" href="assets/shared.css?v=13">
<script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
<style>
  .gate { max-width: 400px; margin: 90px auto 0; padding: 36px 32px; background: var(--bg-elev);
    border: 1px solid var(--hairline); border-radius: 24px; box-shadow: var(--shadow-lg); }
  .gate h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 6px; }
  .gate p { color: var(--text-dim); font-size: .85rem; margin-bottom: 20px; }
  .gate input { width: 100%; margin-bottom: 12px; }

  .wrap { max-width: 860px; margin: 0 auto; padding: 32px 20px 100px; }
  .head h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -.02em; }
  .head .meta { color: var(--text-dim); font-size: .84rem; margin-top: 3px; }

  .count-bar { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0 14px; }
  .count-bar .cbx { display: inline-flex; align-items: center; gap: 7px; padding: 10px 16px; border-radius: 12px;
    background: var(--bg-elev); border: 1px solid var(--hairline); font-size: .88rem; font-weight: 700; box-shadow: var(--shadow-sm); }
  .count-bar .cbx .n { font-weight: 800; font-size: 1.15rem; color: var(--accent-deep); }
  .hint { font-size: .78rem; color: var(--text-faint); margin: 0 0 18px; line-height: 1.5; }
  .search { margin: 0 0 20px; }
  .search input { max-width: 300px; }

  .names { display: flex; flex-wrap: wrap; gap: 9px; }
  .nm { display: inline-flex; align-items: baseline; gap: 6px; padding: 9px 14px; border-radius: 12px;
    background: var(--accent-tint); border: 1px solid var(--accent-soft); font-size: .95rem; }
  .nm b { font-weight: 700; color: var(--accent-deep); }
  .nm .uni { font-size: .7rem; color: var(--text-faint); }
  .nm.hit { box-shadow: 0 0 0 2px rgba(202,138,4,.75); }
  .sec { margin-bottom: 26px; }
  .sec-head { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; font-weight: 800; padding: 11px 15px;
    border-radius: 13px; background: var(--accent-tint); color: var(--accent-deep); border: 1px solid var(--accent-soft); margin-bottom: 13px; }
  .sec-head .cnt { margin-left: auto; font-size: .92rem; font-weight: 800; }
  .sec-head .cnt .cap { color: var(--text-faint); font-weight: 600; }
  .sec-head .cnt .full { color: #b91c1c; }
  .sec .empty-sec { color: var(--text-faint); font-size: .88rem; padding: 6px 2px; }
  .empty { color: var(--text-faint); text-align: center; padding: 48px 20px; line-height: 1.6; }

  /* 체크: 이름 누르면 없음 → 완료(초록) → 잔돈(주황) → 없음 */
  .nm { cursor: pointer; user-select: none; transition: background .12s, border-color .12s; }
  .nm .mark { font-size: .66rem; font-weight: 800; color: #fff; padding: 1px 6px; border-radius: 6px; align-self: center; }
  .nm[data-st="done"]   { background: #dcfce7; border-color: #86efac; }
  .nm[data-st="done"] b { color: #15803d; }
  .nm[data-st="done"] .mark { background: #16a34a; }
  .nm[data-st="change"]   { background: #fef3c7; border-color: #fcd34d; }
  .nm[data-st="change"] b { color: #b45309; }
  .nm[data-st="change"] .mark { background: #f59e0b; }
  .sec-head .cnt .st { font-weight: 800; margin-left: 8px; font-size: .82rem; }
  .sec-head .cnt .st.d { color: #15803d; } .sec-head .cnt .st.c { color: #b45309; }
  .legend { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: .78rem; color: var(--text-dim); margin: 0 0 16px; }
  .legend .lp { display: inline-flex; align-items: center; gap: 6px; }
  .legend .dot { width: 13px; height: 13px; border-radius: 4px; display: inline-block; }
  .legend .dot.d { background: #16a34a; } .legend .dot.c { background: #f59e0b; }
</style>
</head>
<body>

<div id="gate-view">
  <div class="gate">
    <h2>🚤 호핑 투어 수요조사</h2>
    <p>담당자 전용입니다. 비밀번호를 입력하세요.</p>
    <form id="gate-form">
      <input class="input" id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" required>
      <button class="btn-primary" id="gate-btn" type="submit" style="width:100%;">열기</button>
    </form>
  </div>
</div>

<main id="app-view" class="wrap hidden">
  <div class="head">
    <h1>🚤 호핑 투어 예약자</h1>
    <div class="meta" id="meta">날짜별 예약 현황 · 신청 마감 7월 8일(화) 오후 3시</div>
  </div>
  <div class="count-bar" id="counts"></div>
  <div class="hint"><b>이름을 누르면</b> 완료 → 잔돈 → 해제 순으로 체크됩니다. 저장되어 <b>모든 담당자에게 공유</b>되며 15초마다 자동 갱신됩니다.</div>
  <div class="legend">
    <span class="lp"><span class="dot d"></span> <b>완료</b> 참여 확인</span>
    <span class="lp"><span class="dot c"></span> <b>잔돈</b> 잔돈 지급 대상</span>
  </div>
  <div class="search"><input class="input" id="q" type="search" placeholder="이름 검색"></div>
  <div id="list"></div>
</main>

<div class="toast" id="toast"></div>

<script type="module">
import { supabase } from "./assets/supabase.js?v=4";

const $ = (id) => document.getElementById(id);
const toast = $("toast");
function showToast(m, t = "") { toast.textContent = m; toast.className = `toast show ${t}`; setTimeout(() => toast.classList.remove("show"), 2600); }
const esc = (s) => (s == null ? "" : String(s)).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

const PW = "8686";
const TABLE = "hopping_registrations";
const TOURS = [
  { date: "2026-07-12", label: "7월 12일 (일)", cap: 90 },
  { date: "2026-07-18", label: "7월 18일 (토)", cap: 60 },
];
const normDate = (d) => (d === "2026-07-17" ? "2026-07-18" : d);   // 옛 날짜(캐시된 페이지) 흡수
let ROWS = [];
let ready = false;

$("gate-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if ($("pw").value !== PW) { showToast("비밀번호가 올바르지 않습니다.", "error"); return; }
  $("gate-view").classList.add("hidden");
  $("app-view").classList.remove("hidden");
  await load();
  render();
  setInterval(sync, 15000);
});

async function load() {
  try {
    const { data, error } = await supabase.from(TABLE).select("*");
    if (error) throw error;
    ROWS = (data || []).map((r) => ({ ...r, tour_date: normDate(r.tour_date) }));
    ready = true;
  } catch (_) {
    ready = false; ROWS = [];
    showToast("명단을 불러오지 못했습니다(관리자 SQL 필요).", "error");
  }
}
async function sync() {
  if (!ready) return;
  try {
    const { data, error } = await supabase.from(TABLE).select("*");
    if (error) throw error;
    ROWS = (data || []).map((r) => ({ ...r, tour_date: normDate(r.tour_date) }));
    render();
  } catch (_) { /* 일시적 오류는 조용히 무시 */ }
}

$("q").addEventListener("input", render);

// 이름 클릭 → 없음 → 완료 → 잔돈 → 없음 (DB 저장, 담당자 공유)
$("list").addEventListener("click", async (e) => {
  const chip = e.target.closest(".nm"); if (!chip) return;
  const id = chip.dataset.id;
  const row = ROWS.find((r) => r.id === id); if (!row) return;
  const CYCLE = [null, "done", "change"];
  const cur = (row.check_status === "done" || row.check_status === "change") ? row.check_status : null;
  const next = CYCLE[(CYCLE.indexOf(cur) + 1) % 3];
  const prev = row.check_status;
  row.check_status = next;      // 낙관적 업데이트
  render();
  try {
    const { error } = await supabase.from(TABLE).update({ check_status: next }).eq("id", id);
    if (error) throw error;
  } catch (_) {
    row.check_status = prev; render();
    showToast("저장 실패 — check_status 컬럼이 없거나 네트워크 오류입니다.", "error");
  }
});

function render() {
  const q = ($("q").value || "").trim();
  const total = ROWS.length;

  $("counts").innerHTML =
    TOURS.map((t) => {
      const n = ROWS.filter((r) => r.tour_date === t.date).length;
      return `<span class="cbx">${t.label} <span class="n">${n}</span>/${t.cap}명</span>`;
    }).join("") +
    `<span class="cbx" style="opacity:.75">전체 <span class="n">${total}</span>명</span>`;

  if (!total) {
    $("list").innerHTML = `<div class="empty">아직 예약자가 없습니다.<br>학생이 준비현황 페이지에서 예약하면 여기에 표시됩니다.</div>`;
    return;
  }

  let html = "";
  for (const t of TOURS) {
    const rows = ROWS.filter((r) => r.tour_date === t.date)
      .sort((a, b) => String(a.name || "").localeCompare(String(b.name || ""), "ko"));
    const shown = rows.filter((r) => !q || String(r.name || "").includes(q));
    const full = rows.length >= t.cap;
    const done = rows.filter((r) => r.check_status === "done").length;
    const chg = rows.filter((r) => r.check_status === "change").length;
    html += `<div class="sec">
      <div class="sec-head"><iconify-icon icon="solar:calendar-mark-bold-duotone"></iconify-icon> ${t.label}
        <span class="cnt"><span class="${full ? "full" : ""}">${rows.length}</span> <span class="cap">/ ${t.cap}명${q ? " · 검색 " + shown.length : ""}</span><span class="st d">완료 ${done}</span><span class="st c">잔돈 ${chg}</span></span></div>
      ${shown.length
        ? `<div class="names">${shown.map((r) => {
            const st = (r.check_status === "done" || r.check_status === "change") ? r.check_status : "";
            const mark = st === "done" ? `<span class="mark">완료</span>` : st === "change" ? `<span class="mark">잔돈</span>` : "";
            return `<span class="nm${q ? " hit" : ""}" data-id="${esc(r.id)}" data-st="${st}">${mark}<b>${esc(r.name)}</b>${r.university ? `<span class="uni">${esc(r.university)}</span>` : ""}</span>`;
          }).join("")}</div>`
        : `<div class="empty-sec">${q ? "검색 결과가 없습니다." : "아직 이 날짜 예약자가 없습니다."}</div>`}
    </div>`;
  }
  $("list").innerHTML = html;
}
</script>
</body>
</html>
