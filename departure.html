<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>출국 안내 · 2026년 8월 과정</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
:root{
  --bg:#f7f9fc; --card:#fff; --surface:#f1f4f9;
  --accent:#0055a6; --deep:#002242; --soft:rgba(0,85,166,.10);
  --text:#0f172a; --dim:#475569; --faint:#94a3b8;
  --line:rgba(15,23,42,.09); --line2:rgba(15,23,42,.16);
  --sh:0 1px 2px rgba(15,23,42,.05); --sh-lg:0 18px 40px rgba(15,23,42,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);
  font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
  word-break:keep-all;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:700px;margin:0 auto;padding:0 18px 80px}

.hero{background:linear-gradient(160deg,#0055a6,#002242);color:#fff;border-radius:0 0 26px 26px;
  margin:0 -18px 20px;padding:30px 24px 26px;box-shadow:var(--sh-lg)}
.hero .eyebrow{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.72;font-weight:600}
.hero h1{margin:8px 0 12px;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.hero p{font-size:14px;opacity:.8;font-weight:500}
.hero p b{opacity:1;font-weight:700}

.search{position:sticky;top:0;z-index:20;padding:12px 0 10px;
  background:linear-gradient(var(--bg) 78%,rgba(247,249,252,0))}
.search-box{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line2);
  border-radius:16px;padding:14px 16px;box-shadow:var(--sh)}
.search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
.search-box svg{flex:none;color:var(--faint)}
#q{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:17px;font-weight:600;min-width:0}
#q::placeholder{color:var(--faint);font-weight:500}
#q::-webkit-search-cancel-button,#q::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
#clear{flex:none;border:0;background:var(--surface);color:var(--dim);width:26px;height:26px;
  border-radius:50%;cursor:pointer;font-size:15px;line-height:1;display:none}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;
  box-shadow:var(--sh);margin-bottom:14px}
.card.hit{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft),var(--sh-lg)}
.empty{text-align:center;padding:30px 18px;color:var(--faint);font-size:14.5px}
.empty b{color:var(--dim)}

.me-name{font-size:23px;font-weight:800;letter-spacing:-.02em}
.me-pick{margin-top:14px;background:var(--soft);border-radius:14px;padding:15px 17px}
.me-pick .lbl{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.06em}
.me-pick .big{font-size:34px;font-weight:800;color:var(--accent);letter-spacing:-.03em;line-height:1.15;
  margin-top:3px;font-variant-numeric:tabular-nums}
.me-pick .cap{margin-top:5px;font-size:13px;font-weight:600;color:var(--dim)}
.rowline{display:flex;gap:9px;margin-top:13px;font-size:14px;flex-wrap:wrap;align-items:baseline}
.rowline .k{color:var(--faint);font-weight:700;font-size:12.5px;min-width:44px}
.rowline .v{font-weight:700}
.rowline .v em{font-style:normal;color:var(--dim);font-weight:600}

h2.sec{margin:26px 2px 12px;font-size:15px;font-weight:800;color:var(--dim)}
.grp-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
  padding-bottom:13px;border-bottom:1px solid var(--line)}
.grp-time{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.06em}
.grp-time .t{display:block;font-size:26px;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.grp-n{flex:none;background:var(--surface);color:var(--dim);font-size:12.5px;font-weight:800;
  padding:5px 11px;border-radius:999px;white-space:nowrap}
.fl{margin-top:14px}
.fl+.fl{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line2)}
.fl-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;font-size:14px}
.fl-no{font-size:17px;font-weight:800;letter-spacing:-.01em}
.fl-meta{color:var(--dim);font-weight:600;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;
  font:inherit;font-size:13.5px;font-weight:700;color:var(--text);cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

.tip{background:#fffbeb;border:1px solid #fde68a;border-radius:14px;padding:14px 16px;margin-bottom:14px;
  font-size:13.5px;color:#92400e;line-height:1.6}
.tip b{font-weight:800}
footer{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;
  color:var(--faint);line-height:1.7}
@media (max-width:400px){ .me-pick .big{font-size:29px} .hero h1{font-size:22px} }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="eyebrow">LCIC · Departure</div>
    <h1>출국 안내</h1>
    <p><b>2026년 8월 과정</b> · 8/28(금) ~ 8/30(일) · 총 <b id="total">0</b>명</p>
  </header>

  <div class="search">
    <div class="search-box">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="이름을 입력하세요 (예: 김민서, ㄱㅁㅅ)" aria-label="이름 검색">
      <button id="clear" type="button" aria-label="지우기">×</button>
    </div>
  </div>

  <div id="result"></div>

  <div class="tip">
    <b>버스 출발 시각</b>은 학교에서 공항으로 출발하는 시각입니다.
    시간에 맞춰 짐을 다 챙기고 <b>미리 나와 계세요.</b> 버스는 기다리지 않습니다.
  </div>

  <h2 class="sec">전체 출국 일정</h2>
  <div id="groups"></div>

  <footer>
    항공편 시각은 <b>현지(세부) 시각</b>입니다. 모두 막탄 세부 공항 터미널 2(T2)에서 출발합니다.<br>
    변경 사항이 생기면 이 페이지가 갱신됩니다.<br>
    <a href="departure-1page.html" style="display:inline-block;margin-top:9px">전체 일정 한 장으로 보기 (인쇄용)</a>
  </footer>
</div>

<script>
const GROUPS = [{"pick":"2026.08.28 22:00","pickDate":{"md":"8/28","wd":"금"},"pickTime":"22:00","staff":"James","flights":[{"no":"KE602","dep":"01:00","depDate":{"md":"8/29","wd":"토"},"term":"T2","names":["강지영","권지영","김가현","김시율","김윤지","김현중","박래은","전채은","정희윤","함채린"]}],"n":10},{"pick":"2026.08.28 23:00","pickDate":{"md":"8/28","wd":"금"},"pickTime":"23:00","staff":"James","flights":[{"no":"LJ32","dep":"02:20","depDate":{"md":"8/29","wd":"토"},"term":"T2","names":["강하은","김보빈","노지윤","송채현","송혜림","여승우","이다원","임여진","전우진","정해린"]}],"n":10},{"pick":"2026.08.29 11:30","pickDate":{"md":"8/29","wd":"토"},"pickTime":"11:30","staff":"James","flights":[{"no":"FY3693","dep":"14:30","depDate":{"md":"8/29","wd":"토"},"term":"T2","names":["김나윤"]},{"no":"5J130","dep":"14:50","depDate":{"md":"8/29","wd":"토"},"term":"T2","names":["김시윤","임예진"]}],"n":3},{"pick":"2026.08.29 22:00","pickDate":{"md":"8/29","wd":"토"},"pickTime":"22:00","staff":"James","flights":[{"no":"KE602","dep":"01:00","depDate":{"md":"8/30","wd":"일"},"term":"T2","names":["성희찬","최인서"]},{"no":"7C2114","dep":"01:45","depDate":{"md":"8/30","wd":"일"},"term":"T2","names":["김이현","박시현","유수연"]}],"n":5},{"pick":"2026.08.29 23:20","pickDate":{"md":"8/29","wd":"토"},"pickTime":"23:20","staff":"James","flights":[{"no":"LJ32","dep":"02:20","depDate":{"md":"8/30","wd":"일"},"term":"T2","names":["김경민","김다혜","김민서","김서우","김승하","김이빈","김준원","문시원","민수인","박소은","서은정","유경민","유승완","유준용","윤서영","이경택","이선재","정진아","정태호","정휘성","최연우","최은서","추재석","한지호","황준상"]}],"n":25}];
const CHO=["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const cho = s => [...s].map(c=>{const i=c.charCodeAt(0)-0xAC00;
  return (i>=0&&i<11172)?CHO[Math.floor(i/588)]:c;}).join("");

const people = [];
GROUPS.forEach((g,gi)=>g.flights.forEach((f,fi)=>f.names.forEach(n=>
  people.push({name:n, cho:cho(n), gi, fi}))));
document.getElementById("total").textContent = people.length;

const $q=document.getElementById("q"), $res=document.getElementById("result"),
      $groups=document.getElementById("groups"), $clear=document.getElementById("clear");

function meCard(p){
  const g=GROUPS[p.gi], f=g.flights[p.fi];
  return `<div class="card hit">
    <div class="me-name">${p.name}</div>
    <div class="me-pick">
      <div class="lbl">버스 출발 (학교 → 공항)</div>
      <div class="big">${g.pickDate.md}(${g.pickDate.wd}) ${g.pickTime}</div>
      <div class="cap">이 시각에 학교에서 버스가 출발합니다</div>
    </div>
    <div class="rowline"><span class="k">항공편</span>
      <span class="v">${f.no} <em>· ${f.depDate.md}(${f.depDate.wd}) ${f.dep} 출발</em></span></div>
    <div class="rowline"><span class="k">터미널</span><span class="v">${f.term} <em>· 막탄 세부 공항</em></span></div>
    <div class="rowline"><span class="k">인솔</span><span class="v">${g.staff||"-"}</span></div>
  </div>`;
}

function render(){
  const raw=$q.value.trim();
  $clear.style.display = raw ? "block" : "none";
  document.querySelectorAll(".chip.on").forEach(c=>c.classList.remove("on"));
  if(!raw){
    $res.innerHTML=`<div class="card"><div class="empty">
      위에 <b>이름</b>을 넣으면 내 버스 시간이 바로 나옵니다.</div></div>`;
    return;
  }
  const k=raw.replace(/\s/g,"");
  const hits=people.filter(p=>p.name.includes(k)||p.cho.includes(k));
  $res.innerHTML = hits.length ? hits.map(meCard).join("")
    : `<div class="card"><div class="empty"><b>“${raw}”</b> 이름을 찾지 못했어요.<br>
       아래 전체 일정에서 확인하거나 담당 선생님께 문의해 주세요.</div></div>`;
  hits.forEach(p=>{
    const c=document.querySelector(`.chip[data-n="${p.name}"]`);
    if(c) c.classList.add("on");
  });
}

$groups.innerHTML = GROUPS.map(g=>`
  <div class="card">
    <div class="grp-top">
      <div class="grp-time">버스 출발<span class="t">${g.pickDate.md}(${g.pickDate.wd}) ${g.pickTime}</span></div>
      <span class="grp-n">${g.n}명</span>
    </div>
    ${g.flights.map(f=>`<div class="fl">
      <div class="fl-head"><span class="fl-no">${f.no}</span>
        <span class="fl-meta">${f.depDate.md}(${f.depDate.wd}) ${f.dep} 출발 · ${f.term} · ${f.names.length}명</span></div>
      <div class="chips">${f.names.map(n=>`<button class="chip" data-n="${n}">${n}</button>`).join("")}</div>
    </div>`).join("")}
  </div>`).join("");

$groups.onclick = e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  $q.value=b.dataset.n; render();
  window.scrollTo({top:0,behavior:"smooth"});
};
$clear.onclick=()=>{ $q.value=""; render(); $q.focus(); };
$q.addEventListener("input", render);
render();
</script>
</body>
</html>
