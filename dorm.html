<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>기숙사 야간 당직 (NDIC) · LCIC</title>
<link rel="icon" type="image/png" href="assets/brand/lcic-logo.png">
<script src="assets/background.js?v=8"></script>
<link rel="stylesheet" href="assets/shared.css?v=13">
<style>
  .gate { max-width: 400px; margin: 90px auto 0; padding: 36px 32px; background: var(--bg-elev);
    border: 1px solid var(--hairline); border-radius: 24px; box-shadow: var(--shadow-lg); }
  .gate h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 6px; }
  .gate p { color: var(--text-dim); font-size: .85rem; margin-bottom: 20px; }
  .gate input { width: 100%; margin-bottom: 12px; }

  .wrap { max-width: 900px; margin: 0 auto; padding: 32px 20px 100px; }
  .head h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -.02em; }
  .head .meta { color: var(--text-dim); font-size: .84rem; margin-top: 4px; line-height: 1.55; }

  /* 오늘 당직 — 이 페이지에서 제일 먼저 보여야 하는 정보 */
  .today { display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
    border: 1px solid var(--accent); border-radius: 20px; padding: 18px 20px; margin: 22px 0 26px;
    background: var(--accent-tint); box-shadow: var(--shadow-sm); }
  .today img { width: 116px; border-radius: 14px; background: #f1f5f9; display: block; }
  .today .who { min-width: 0; }
  .today .tag { font-size: .72rem; font-weight: 800; letter-spacing: .04em; color: var(--accent-deep); }
  .today .nm { font-size: 1.45rem; font-weight: 800; margin: 2px 0 2px; }
  .today .role { font-size: .8rem; color: var(--text-dim); }
  .today .per { font-size: .84rem; color: var(--text-dim); margin-top: 6px; }
  .today .tel { display: inline-block; margin-top: 10px; font-size: 1.12rem; font-weight: 800;
    color: var(--accent-deep); text-decoration: none; letter-spacing: .01em; }
  .today .tel:hover { text-decoration: underline; }
  .today.none { border-color: var(--hairline); background: var(--bg-elev); }

  .sec-label { font-size: .8rem; font-weight: 800; color: var(--text-faint);
    margin: 26px 2px 12px; letter-spacing: .02em; }

  /* 핫라인 */
  .hot { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .hot .card { border: 1px solid var(--hairline); border-radius: 16px; padding: 15px 16px;
    background: var(--bg-elev); box-shadow: var(--shadow-sm); }
  .hot .rank { display: inline-block; font-size: .68rem; font-weight: 800; padding: 3px 8px; border-radius: 99px;
    background: var(--accent); color: #fff; letter-spacing: .03em; }
  .hot .rank.alt { background: var(--hairline); color: var(--text-dim); }
  .hot .lab { font-size: .95rem; font-weight: 800; margin: 8px 0 2px; }
  .hot .tel { font-size: 1.16rem; font-weight: 800; color: var(--accent-deep); text-decoration: none; }
  .hot .tel:hover { text-decoration: underline; }
  .hot .note { font-size: .76rem; color: var(--text-faint); margin-top: 7px; line-height: 1.5; }

  /* 당직표 */
  .shifts { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .sh { display: flex; gap: 13px; border: 1px solid var(--hairline); border-radius: 16px; padding: 13px 14px;
    background: var(--bg-elev); box-shadow: var(--shadow-sm); }
  .sh.now { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-tint), var(--shadow-sm); }
  .sh.past { opacity: .55; }
  .sh img { width: 74px; height: auto; align-self: flex-start; border-radius: 11px; background: #f1f5f9; display: block; }
  .sh .body { min-width: 0; display: flex; flex-direction: column; }
  .sh .when { font-size: .84rem; font-weight: 800; }
  .sh .nm { font-size: 1.02rem; font-weight: 800; margin-top: 3px; }
  .sh .role { font-size: .72rem; color: var(--text-faint); }
  .sh .tel { margin-top: 6px; font-size: .95rem; font-weight: 700; color: var(--accent-deep); text-decoration: none; }
  .sh .tel:hover { text-decoration: underline; }
  .sh .badge { display: inline-block; align-self: flex-start; margin-top: 7px; font-size: .68rem; font-weight: 800;
    padding: 2px 8px; border-radius: 99px; background: var(--accent); color: #fff; }

  /* 사진 클릭 → 크게 보기. 원본이 202px 짜리라 확대해도 한계가 있어 400px 정도로 제한한다. */
  .zoomable { cursor: zoom-in; }
  .lb { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center;
    padding: 24px; background: rgba(15, 23, 42, .72); backdrop-filter: blur(4px); cursor: zoom-out; }
  .lb.open { display: flex; }
  .lb-box { max-width: 400px; width: 100%; text-align: center; }
  .lb-box img { width: 100%; max-height: 74vh; object-fit: contain; border-radius: 18px;
    background: #f1f5f9; box-shadow: 0 30px 70px rgba(15, 23, 42, .45); }
  .lb-cap { margin-top: 14px; color: #fff; }
  .lb-cap .nm { font-size: 1.25rem; font-weight: 800; }
  .lb-cap .role { font-size: .82rem; opacity: .8; margin-top: 2px; }
  .lb-cap .per { font-size: .85rem; opacity: .9; margin-top: 6px; }
  .lb-cap .tel { display: inline-block; margin-top: 8px; font-size: 1.05rem; font-weight: 800;
    color: #fff; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,.5); }
  .lb-hint { margin-top: 14px; font-size: .74rem; color: rgba(255,255,255,.62); }

  .gap { border: 1px dashed var(--hairline); border-radius: 14px; padding: 12px 14px; margin-top: 12px;
    font-size: .84rem; color: var(--text-dim); line-height: 1.55; background: transparent; }
  .gap b { color: var(--text); }
  .src { margin-top: 30px; font-size: .74rem; color: var(--text-faint); line-height: 1.6; }
</style>
</head>
<body>

<div id="gate-view">
  <div class="gate">
    <h2>🏠 기숙사 야간 당직 (NDIC)</h2>
    <p>담당자 전용입니다. 비밀번호를 입력하세요.</p>
    <form id="gate-form">
      <input class="input" id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" required>
      <button class="btn-primary" id="gate-btn" type="submit" style="width:100%;">열기</button>
    </form>
  </div>
</div>

<main id="app-view" class="wrap hidden">
  <div class="head">
    <h1>🏠 기숙사 야간 당직 (NDIC)</h1>
    <div class="meta" id="meta"></div>
  </div>
  <div id="today"></div>
  <div class="sec-label">📞 상시 연락처</div>
  <div class="hot" id="hot"></div>
  <div class="sec-label" id="shift-label">🗓 당직표</div>
  <div class="shifts" id="shifts"></div>
  <div id="gaps"></div>
  <div class="src" id="src"></div>
</main>

<div class="lb" id="lb">
  <div class="lb-box">
    <img id="lb-img" alt="">
    <div class="lb-cap" id="lb-cap"></div>
    <div class="lb-hint">아무 곳이나 클릭하거나 Esc 를 누르면 닫힙니다</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
const $ = (id) => document.getElementById(id);
const toast = $("toast");
function showToast(m, t = "") { toast.textContent = m; toast.className = `toast show ${t}`; setTimeout(() => toast.classList.remove("show"), 2600); }
const esc = (s) => (s == null ? "" : String(s)).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
// 전화 링크용: 화면에는 메일 원문 표기 그대로 두고, tel: 값만 공백을 제거한다
const tel = (n) => String(n || "").replace(/\s+/g, "");
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }

async function decryptBlob(b64, password) {
  const raw = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  const salt = raw.slice(0, 16), iv = raw.slice(16, 28), tag = raw.slice(28, 44), ct = raw.slice(44);
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const data = new Uint8Array(ct.length + tag.length); data.set(ct); data.set(tag, ct.length);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
  return JSON.parse(new TextDecoder().decode(pt));
}

let DATA = null;

$("gate-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("gate-btn"); btn.disabled = true; btn.textContent = "여는 중…";
  try {
    DATA = await decryptBlob(window.DORM_BLOB, $("pw").value);
    DATA.updated = DATA.updated || window.DORM_UPDATED;
    $("gate-view").classList.add("hidden");
    $("app-view").classList.remove("hidden");
    render();
  } catch (_) {
    btn.disabled = false; btn.textContent = "열기";
    showToast("비밀번호가 올바르지 않습니다.", "error");
  }
});

function photoOf(s) { return (DATA.photos && DATA.photos[s.photo]) || ""; }

function render() {
  const today = todayStr();
  const shifts = DATA.shifts || [];
  const nowIdx = shifts.findIndex((s) => s.start <= today && today <= s.end);
  const now = nowIdx < 0 ? null : shifts[nowIdx];

  $("meta").innerHTML =
    `${esc(DATA.monthLabel || DATA.month)} 하우스 페어런트 야간 당직 배정.<br>` +
    `${esc(DATA.intro || "")}`;

  // 오늘 당직
  $("today").innerHTML = now
    ? `<div class="today">
         ${photoOf(now) ? `<img class="zoomable" data-i="${nowIdx}" src="${photoOf(now)}" alt="${esc(now.name)}">` : ""}
         <div class="who">
           <div class="tag">오늘 당직 (NDIC)</div>
           <div class="nm">MS. ${esc(now.name)}</div>
           <div class="role">${esc(now.role || "")}${now.alias ? ` · ${esc(now.alias)}` : ""}</div>
           <div class="per">${esc(now.label)}</div>
           <a class="tel" href="tel:${esc(tel(now.mobile))}">📞 ${esc(now.mobile)}</a>
         </div>
       </div>`
    : `<div class="today none">
         <div class="who">
           <div class="tag">오늘 당직 (NDIC)</div>
           <div class="nm" style="font-size:1.1rem;">오늘 날짜에 배정된 당직이 없습니다</div>
           <div class="per">아래 상시 연락처(Business House Parent)로 연락하세요.</div>
         </div>
       </div>`;

  // 상시 연락처
  $("hot").innerHTML = (DATA.hotlines || []).map((h, i) => `
    <div class="card">
      <span class="rank ${i ? "alt" : ""}">${esc(h.rank || "")}</span>
      <div class="lab">${esc(h.label)}</div>
      <a class="tel" href="tel:${esc(tel(h.mobile))}">📞 ${esc(h.mobile)}</a>
      <div class="note">${esc(h.note || "")}</div>
    </div>`).join("");

  // 당직표
  $("shift-label").textContent = `🗓 ${DATA.monthLabel || DATA.month} 당직표`;
  $("shifts").innerHTML = shifts.map((s, i) => {
    const cur = s.start <= today && today <= s.end;
    const past = s.end < today;
    return `<div class="sh ${cur ? "now" : ""} ${past ? "past" : ""}">
      ${photoOf(s) ? `<img class="zoomable" data-i="${i}" src="${photoOf(s)}" alt="${esc(s.name)}">` : ""}
      <div class="body">
        <div class="when">${esc(s.label)}</div>
        <div class="nm">MS. ${esc(s.name)}</div>
        <div class="role">${esc(s.role || "")}</div>
        <a class="tel" href="tel:${esc(tel(s.mobile))}">${esc(s.mobile)}</a>
        ${cur ? `<span class="badge">오늘</span>` : ""}
      </div>
    </div>`;
  }).join("");

  // 배정이 빈 구간
  $("gaps").innerHTML = (DATA.gaps || []).map((g) =>
    `<div class="gap">⚠️ <b>${esc(g.label)}</b> — ${esc(g.note)}</div>`).join("");

  $("src").innerHTML = `출처: ${esc(DATA.source || "")}<br>갱신: ${esc(DATA.updated || "")}`;
}

// ── 사진 크게 보기 ──
function openLightbox(i) {
  const s = (DATA.shifts || [])[i];
  if (!s || !photoOf(s)) return;
  $("lb-img").src = photoOf(s);
  $("lb-img").alt = s.name;
  $("lb-cap").innerHTML =
    `<div class="nm">MS. ${esc(s.name)}</div>
     <div class="role">${esc(s.role || "")}${s.alias ? ` · ${esc(s.alias)}` : ""}</div>
     <div class="per">${esc(s.label)}</div>
     <a class="tel" href="tel:${esc(tel(s.mobile))}">📞 ${esc(s.mobile)}</a>`;
  $("lb").classList.add("open");
}
function closeLightbox() { $("lb").classList.remove("open"); }

document.addEventListener("click", (e) => {
  const img = e.target.closest("img.zoomable");
  if (img) { openLightbox(Number(img.dataset.i)); return; }
  // 확대 화면 안의 전화번호를 누를 땐 닫지 않는다
  if (e.target.closest("#lb") && !e.target.closest(".lb-cap .tel")) closeLightbox();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeLightbox(); });
</script>
</body>
