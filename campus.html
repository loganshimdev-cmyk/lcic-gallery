<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:title" content="LCIC 캠퍼스 지도 — 어디서 뭘 할까?">
<meta property="og:description" content="건물을 눌러 어디서 무엇을 하는지 알아보세요 · Lapulapu Cebu International College">

<title>LCIC 캠퍼스 지도 — 어디서 뭘 할까?</title>
<style>
  :root {
    --bg: #eaf2fb;
    --bg2: #dcebfa;
    --ink: #12233f;
    --ink-dim: #4a5b74;
    --ink-faint: #8595ab;
    --brand: #2563eb;
    --brand-deep: #1e3a8a;
    --brand-soft: #e6effe;
    --yellow: #facc15;
    --grass: #86c559;
    --grass-d: #6fb043;
    --path: #e7e0d2;
    --path-line: #d3c9b4;
    --wall: #ffffff;
    --wall-side: #cfd9e8;
    --wall-line: #d8e1ee;
    --roof: #cbd8ea;
    --sky: #cfe6ff;
    --card: #ffffff;
    --hairline: rgba(18, 35, 63, 0.10);
    --shadow: 0 10px 30px rgba(18, 35, 63, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c1524; --bg2: #0a1220; --ink: #e7eefb; --ink-dim: #9fb0c8; --ink-faint: #64748b;
      --brand: #60a5fa; --brand-deep: #bfdbfe; --brand-soft: #16263f;
      --grass: #4f8f3f; --grass-d: #3f7530; --path: #3a3730; --path-line: #4a463c;
      --wall: #e9eef6; --wall-side: #aab6c8; --wall-line: #cfd8e6; --roof: #b7c4d8;
      --sky: #10233c; --card: #14203450; --hairline: rgba(231,238,251,0.12);
      --shadow: 0 12px 34px rgba(0,0,0,0.5);
    }
    body { background: #0c1524 !important; }
    .card, .detail, .hint-chip, .legend { background: #131f33 !important; }
  }
  :root[data-theme="light"] {
    --bg: #eaf2fb; --bg2: #dcebfa; --ink: #12233f; --ink-dim: #4a5b74; --ink-faint: #8595ab;
    --brand: #2563eb; --brand-deep: #1e3a8a; --brand-soft: #e6effe; --sky: #cfe6ff;
    --wall: #fff; --wall-side: #cfd9e8; --wall-line: #d8e1ee; --roof: #cbd8ea; --card: #fff;
    --grass: #86c559; --grass-d: #6fb043; --path: #e7e0d2; --path-line: #d3c9b4;
  }
  :root[data-theme="dark"] {
    --bg: #0c1524; --bg2: #0a1220; --ink: #e7eefb; --ink-dim: #9fb0c8; --ink-faint: #64748b;
    --brand: #60a5fa; --brand-deep: #bfdbfe; --brand-soft: #16263f;
    --grass: #4f8f3f; --grass-d: #3f7530; --path: #3a3730; --path-line: #4a463c;
    --wall: #e9eef6; --wall-side: #aab6c8; --wall-line: #cfd8e6; --roof: #b7c4d8;
    --sky: #10233c; --card: #131f33;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(ellipse 90% 60% at 50% 0%, var(--bg2), var(--bg));
    color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
    line-height: 1.55;
    min-height: 100dvh;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 22px 16px 40px; }

  /* header */
  .head { text-align: center; margin-bottom: 14px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--brand-soft); color: var(--brand);
    font-size: 0.72rem; font-weight: 800; letter-spacing: 0.12em;
    padding: 5px 13px; border-radius: 999px; text-transform: uppercase;
  }
  .eyebrow .mk { background: var(--yellow); color: #1e3a8a; font-weight: 900; border-radius: 5px; padding: 1px 6px; letter-spacing: 0.04em; }
  h1 { font-size: clamp(1.4rem, 5vw, 1.9rem); font-weight: 900; letter-spacing: -0.02em; margin: 12px 0 4px; text-wrap: balance; }
  .head p { margin: 0; color: var(--ink-dim); font-size: 0.92rem; }
  .head .tap-hint {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 8px; font-size: 0.82rem; font-weight: 700; color: var(--brand);
  }
  .head .tap-hint .finger { animation: tapbob 1.3s ease-in-out infinite; }
  @keyframes tapbob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(3px)} }

  /* map */
  .mapwrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1000 / 1150;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: var(--shadow);
    background: var(--sky);
    -webkit-tap-highlight-color: transparent;
  }
  .mapwrap svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .bld { cursor: pointer; transition: transform 0.18s ease; transform-box: fill-box; transform-origin: center; }
  .bld .lift { transition: transform 0.18s ease; }
  .bld:hover .lift, .bld:focus-visible .lift { transform: translateY(-9px); }
  .bld:focus-visible { outline: none; }
  .bld:focus-visible .top { stroke: var(--brand); stroke-width: 4; }
  .bld:hover .top { stroke: var(--brand); stroke-width: 3; }
  .bld.pop .lift { animation: pop 0.5s cubic-bezier(0.2,1.3,0.4,1) both; }
  @keyframes pop { from { transform: translateY(26px) scale(0.9); opacity: 0; } to { transform: none; opacity: 1; } }

  .palm { transform-box: fill-box; transform-origin: bottom center; animation: sway 4s ease-in-out infinite; }
  .palm:nth-of-type(even) { animation-delay: -1.5s; }
  @keyframes sway { 0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(3deg)} }
  .bus { animation: busidle 3s ease-in-out infinite; transform-box: fill-box; }
  @keyframes busidle { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }
  .flag { transform-box: fill-box; transform-origin: left center; animation: flagwave 2s ease-in-out infinite; }
  @keyframes flagwave { 0%,100%{transform:skewX(0) scaleX(1)} 50%{transform:skewX(-8deg) scaleX(0.94)} }

  /* labels overlay */
  .labels { position: absolute; inset: 0; pointer-events: none; }
  .label {
    position: absolute; transform: translate(-50%, -50%);
    pointer-events: auto; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    text-align: center; width: max-content;
  }
  .label .chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--card); color: var(--ink);
    border: 1.5px solid var(--hairline);
    border-radius: 999px; padding: 4px 10px 4px 7px;
    font-size: 0.78rem; font-weight: 800;
    box-shadow: 0 4px 12px rgba(18,35,63,0.14);
    white-space: nowrap; transition: transform 0.15s, border-color 0.15s;
  }
  .label:hover .chip { transform: translateY(-2px); border-color: var(--brand); }
  .label .chip .ic { font-size: 0.95rem; }
  .label .fl {
    font-size: 0.6rem; font-weight: 800; color: #fff;
    background: var(--brand); border-radius: 999px; padding: 0px 6px; letter-spacing: 0.02em;
  }
  .label.is-constr .chip { background: repeating-linear-gradient(45deg, #fff7db, #fff7db 7px, #fde68a 7px, #fde68a 14px); color: #92610a; border-color: #f0c000; }
  .label.is-constr .fl { background: #d97706; }
  .label.is-dorm .fl { background: #dc2626; }

  /* legend + chips row */
  .legend {
    display: flex; flex-wrap: wrap; gap: 6px 8px; justify-content: center;
    margin-top: 14px; background: var(--card); border: 1px solid var(--hairline);
    border-radius: 14px; padding: 12px; box-shadow: 0 4px 12px rgba(18,35,63,0.05);
  }
  .hint-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--brand-soft); color: var(--ink);
    border: 1px solid transparent; border-radius: 999px;
    padding: 7px 13px; font-size: 0.82rem; font-weight: 700; cursor: pointer;
    transition: transform 0.12s, background 0.15s;
  }
  .hint-chip:hover { transform: translateY(-2px); background: var(--brand); color: #fff; }
  .hint-chip:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .hint-chip .ic { font-size: 0.95rem; }
  .hint-chip .fl { font-size: 0.62rem; font-weight: 800; color: var(--brand); }
  .hint-chip:hover .fl { color: #fff; }
  .hint-chip.c-constr { background: #fef3c7; color: #92610a; }

  .foot { text-align: center; margin-top: 20px; font-size: 0.74rem; color: var(--ink-faint); line-height: 1.6; }
  .foot b { color: var(--ink-dim); }

  /* detail modal */
  .backdrop {
    position: fixed; inset: 0; z-index: 90;
    background: rgba(12, 21, 36, 0.5);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center; padding: 18px;
    opacity: 0; pointer-events: none; transition: opacity 0.22s;
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .detail {
    background: var(--card); color: var(--ink);
    width: min(440px, 100%); max-height: 90dvh; overflow-y: auto;
    border-radius: 22px; box-shadow: 0 30px 70px rgba(0,0,0,0.4);
    transform: translateY(24px) scale(0.97); transition: transform 0.28s cubic-bezier(0.2,1,0.3,1);
  }
  .backdrop.open .detail { transform: none; }
  .detail .photo { position: relative; width: 100%; aspect-ratio: 16/10; background: #0e1a2c; overflow: hidden; border-radius: 22px 22px 0 0; }
  .detail .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .detail .photo .grad { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55)); }
  .detail .photo .close {
    position: absolute; top: 12px; right: 12px; z-index: 2;
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: rgba(0,0,0,0.4); color: #fff; font-size: 1.1rem; cursor: pointer;
    display: grid; place-items: center; backdrop-filter: blur(4px);
  }
  .detail .photo .close:hover { background: rgba(0,0,0,0.65); }
  .detail .photo .tag {
    position: absolute; left: 14px; bottom: 12px; z-index: 2; display: flex; align-items: center; gap: 8px;
  }
  .detail .photo .tag .flbadge {
    background: var(--yellow); color: #1e3a8a; font-weight: 900; font-size: 0.78rem;
    padding: 3px 11px; border-radius: 999px;
  }
  .detail .photo .tag .flbadge.constr { background: #f59e0b; color: #fff; }
  .detail .photo .tag .realtag { color: rgba(255,255,255,0.9); font-size: 0.72rem; font-weight: 700; }
  .detail .body { padding: 18px 22px 24px; }
  .detail .body h2 { margin: 0; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.01em; display: flex; align-items: center; gap: 9px; }
  .detail .body h2 .ic { font-size: 1.5rem; }
  .detail .en { color: var(--brand); font-weight: 800; font-size: 0.82rem; letter-spacing: 0.04em; margin: 2px 0 0 2px; }
  .detail .blurb { margin: 12px 0 0; color: var(--ink-dim); font-size: 0.95rem; }
  .detail .sect { margin-top: 18px; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em; color: var(--ink-faint); text-transform: uppercase; }
  .detail ul { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .detail li {
    display: flex; align-items: center; gap: 11px;
    background: var(--brand-soft); border-radius: 12px; padding: 11px 14px;
    font-size: 0.94rem; font-weight: 600;
  }
  .detail li .li-ic { font-size: 1.15rem; flex: none; }
  .detail .constr-note {
    margin-top: 16px; background: repeating-linear-gradient(45deg, #fff8e1, #fff8e1 9px, #fef0c3 9px, #fef0c3 18px);
    border: 1.5px solid #f0c000; color: #92610a; border-radius: 12px; padding: 12px 14px;
    font-size: 0.9rem; font-weight: 700; display: flex; gap: 9px; align-items: center;
  }
  @media (max-width: 480px) {
    .backdrop { align-items: flex-end; padding: 0; }
    .detail { width: 100%; max-height: 92dvh; border-radius: 22px 22px 0 0; }
    .detail .photo { border-radius: 22px 22px 0 0; }
    .backdrop.open .detail { transform: none; }
    .detail { transform: translateY(100%); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

<div class="wrap">
  <header class="head">
    <span class="eyebrow"><span class="mk">LCIC</span> Campus Map · Cebu</span>
    <h1>우리 캠퍼스, 어디서 뭘 할까?</h1>
    <p>Lapulapu Cebu International College · 신입생 캠퍼스 안내</p>
    <div class="tap-hint"><span class="finger">👆</span> 건물을 눌러보세요</div>

  <div class="mapwrap" id="mapwrap">
    <div id="mapsvg"></div>
    <div class="labels" id="labels"></div>

  <div class="legend" id="legend"></div>

  <p class="foot">
    <b>실제 건물 사진</b>은 드론 항공사진에서 임시로 잘라 넣었어요 (추후 개별 사진으로 교체 예정).<br>
    현재 캠퍼스는 <b>거의 완공</b> 단계로, 신축동은 마무리 공사 중입니다.
  </p>
</div>

<div class="backdrop" id="backdrop">
  <div class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="dt-name"></div>
</div>

        gx = b.x + pad + c*cw + cw*0.22;
        gy = b.y + pad + r*ch + ch*0.22;
        out += '<rect x="'+gx.toFixed(1)+'" y="'+gy.toFixed(1)+'" width="'+(cw*0.56).toFixed(1)+'" height="'+(ch*0.5).toFixed(1)+'" rx="2" fill="#dbe6f5" stroke="#c2d1e6" stroke-width="0.6"/>';
      }
    }
    return out;
  }

  function archCut(b) {
    var r = Math.min(b.w, b.h) * 0.28;
    var cx, cy, d;
    if (b.arch === "bottom") { cx=b.x+b.w/2; cy=b.y+b.h; d='M'+(cx-r)+','+cy+' a'+r+','+r+' 0 0 1 '+(2*r)+',0 Z'; }
    else if (b.arch === "right") { cx=b.x+b.w; cy=b.y+b.h/2; d='M'+cx+','+(cy-r)+' a'+r+','+r+' 0 0 1 0,'+(2*r)+' Z'; }
    else if (b.arch === "left") { cx=b.x; cy=b.y+b.h/2; d='M'+cx+','+(cy-r)+' a'+r+','+r+' 0 0 0 0,'+(2*r)+' Z'; }
    else return "";
    return '<path d="'+d+'" fill="'+(b.construction?'#8a8f98':'#26406f')+'"/>';
  }

  function building(b) {
    var d = 18; // depth
    var cls = "bld" + (b.construction ? " constr" : "");
    var s = '<g class="'+cls+'" data-id="'+b.id+'" tabindex="0" role="button" aria-label="'+b.name+'">';
    s += '<g class="lift">';
    // ground shadow
    s += '<ellipse cx="'+(b.x+b.w/2)+'" cy="'+(b.y+b.h+14)+'" rx="'+(b.w*0.52)+'" ry="14" fill="rgba(18,35,63,0.16)"/>';
    // south side face
    s += '<path d="M'+b.x+','+(b.y+b.h)+' h'+b.w+' l0,'+d+' q0,6 -6,6 h'+(-(b.w-12))+' q-6,0 -6,-6 Z" fill="var(--wall-side)"/>';
    // top face
    s += '<rect class="top" x="'+b.x+'" y="'+b.y+'" width="'+b.w+'" height="'+b.h+'" rx="14" fill="var(--wall)" stroke="var(--wall-line)" stroke-width="1.5"/>';
    // roof band
    s += '<rect x="'+(b.x+8)+'" y="'+(b.y+8)+'" width="'+(b.w-16)+'" height="'+(b.h-16)+'" rx="10" fill="none" stroke="'+b.roof+'" stroke-width="2" opacity="0.7"/>';
    // windows
    s += windows(b);
    // arch
    s += archCut(b);
    // roof accent chip (icon disc)
    s += '<circle cx="'+b.cx+'" cy="'+b.cy+'" r="26" fill="var(--wall)" stroke="'+ (b.construction?'#f0c000':'var(--brand)') +'" stroke-width="3"/>';
    s += '<text x="'+b.cx+'" y="'+(b.cy+9)+'" text-anchor="middle" font-size="26">'+b.ic+'</text>';
    // construction extras
    if (b.construction) {
      s += '<rect x="'+b.x+'" y="'+b.y+'" width="'+b.w+'" height="'+b.h+'" rx="14" fill="url(#hatch)" opacity="0.68"/>';
      s += '<g transform="translate('+(b.x+b.w-30)+','+(b.y-6)+')"><rect x="-4" y="0" width="8" height="54" fill="#6b7280"/><rect x="-30" y="-4" width="70" height="8" fill="#f59e0b"/><line x1="36" y1="0" x2="36" y2="20" stroke="#6b7280" stroke-width="3"/><rect x="30" y="20" width="12" height="10" fill="#facc15"/></g>';
      s += '<text x="'+b.cx+'" y="'+(b.y+b.h-14)+'" text-anchor="middle" font-size="16" font-weight="900" fill="#b45309">공사중</text>';
    }
    // dorm 5F ribbon
    if (b.big) {
      s += '<g transform="translate('+(b.x+b.w-42)+','+(b.y+16)+')"><rect x="-4" y="-2" width="46" height="22" rx="11" fill="#dc2626"/><text x="19" y="13" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">5층</text></g>';
    }
    s += '</g></g>';
    return s;
  }

  function svgMap() {
    var s = '<svg viewBox="0 0 '+VW+' '+VH+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LCIC 캠퍼스 배치 지도">';
    // defs
    s += '<defs>';
    s += '<linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--bg2)"/><stop offset="1" stop-color="var(--bg)"/></linearGradient>';
    s += '<pattern id="hatch" width="16" height="16" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#fde68a" opacity="0.5"/><rect width="8" height="16" fill="#fbbf24" opacity="0.55"/></pattern>';
    s += '</defs>';
    // base ground
    s += '<rect x="0" y="0" width="'+VW+'" height="'+VH+'" fill="url(#ground)"/>';
    // plaza slab
    s += '<rect x="70" y="60" width="860" height="1030" rx="40" fill="var(--path)" stroke="var(--path-line)" stroke-width="2"/>';
    // central courtyard grass
    s += '<rect x="372" y="230" width="256" height="600" rx="30" fill="var(--grass)" stroke="var(--grass-d)" stroke-width="3"/>';
    s += '<rect x="372" y="230" width="256" height="600" rx="30" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>';
    // cross paths in courtyard
    s += '<rect x="488" y="215" width="24" height="630" fill="var(--path)"/>';
    s += '<rect x="360" y="518" width="280" height="24" fill="var(--path)"/>';
    // central medallion
    s += '<circle cx="500" cy="530" r="34" fill="var(--path)" stroke="var(--path-line)" stroke-width="2"/><circle cx="500" cy="530" r="18" fill="none" stroke="var(--brand)" stroke-width="2" opacity="0.5"/>';
    // approach path bottom
    s += '<rect x="480" y="830" width="40" height="180" fill="var(--path)"/>';
    // entrance arch (bottom center, decorative)
    s += '<g><rect x="410" y="852" width="180" height="120" rx="16" fill="var(--wall)" stroke="var(--wall-line)" stroke-width="1.5"/><path d="M455,972 a45,45 0 0 1 90,0 Z" fill="#26406f"/><text x="500" y="905" text-anchor="middle" font-size="15" font-weight="800" fill="var(--brand-deep)">정문</text></g>';
    // parking + bus (bottom-left)
    s += '<g><rect x="120" y="860" width="230" height="150" rx="14" fill="#dfe6f0" stroke="var(--path-line)" stroke-width="1.5"/>';
    s += '<line x1="180" y1="866" x2="180" y2="1004" stroke="#c2ccd9" stroke-width="1.5"/><line x1="240" y1="866" x2="240" y2="1004" stroke="#c2ccd9" stroke-width="1.5"/><line x1="300" y1="866" x2="300" y2="1004" stroke="#c2ccd9" stroke-width="1.5"/>';
    s += '<g class="bus"><rect x="132" y="890" width="42" height="86" rx="8" fill="var(--yellow)" stroke="#d4a70a" stroke-width="2"/><rect x="138" y="898" width="30" height="20" rx="4" fill="#bfe0ff"/><rect x="138" y="924" width="30" height="6" rx="3" fill="#1e3a8a"/><text x="153" y="960" text-anchor="middle" font-size="10" font-weight="900" fill="#1e3a8a">LCIC</text></g>';
    s += '<text x="270" y="948" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink-faint)">주차장 · 🚌</text></g>';

    // decorative palms at courtyard corners
    var palms = [[388,250],[612,250],[388,812],[612,812]];
    palms.forEach(function(p){
      s += '<g class="palm"><rect x="'+(p[0]-3)+'" y="'+(p[1]-4)+'" width="6" height="26" rx="3" fill="#8a6b3f"/>';
      s += '<circle cx="'+p[0]+'" cy="'+(p[1]-6)+'" r="14" fill="#3f8f43"/><circle cx="'+(p[0]-9)+'" cy="'+(p[1]-2)+'" r="9" fill="#4a9c4c"/><circle cx="'+(p[0]+9)+'" cy="'+(p[1]-2)+'" r="9" fill="#4a9c4c"/></g>';
    });
    // flag on admin roof
    s += '<g transform="translate(680,86)"><rect x="0" y="-30" width="3" height="34" fill="#7a8699"/><path class="flag" d="M3,-30 h34 v18 h-34 Z" fill="var(--brand)"/><text x="20" y="-17" text-anchor="middle" font-size="9" font-weight="900" fill="#fff">LCIC</text></g>';

    // buildings
    B.forEach(function(b){ s += building(b); });

    s += '</svg>';
    return s;
  }

  // ---- labels overlay ----
  function labels() {
    var el = document.getElementById("labels");
    el.innerHTML = B.map(function(b){
      var cls = "label" + (b.construction ? " is-constr" : "") + (b.big ? " is-dorm" : "");
      var flTxt = b.construction ? "공사중" : (b.floors + "층");
      var lx = (b.cx / VW * 100), ly = ((b.y + b.h + 34) / VH * 100);
      return '<div class="'+cls+'" data-id="'+b.id+'" style="left:'+lx+'%; top:'+ly+'%">'
        + '<span class="chip"><span class="ic">'+b.ic+'</span>'+b.name+' <span class="fl">'+flTxt+'</span></span></div>';
    }).join("");
  }

  // ---- legend chips ----
  function legend() {
    var el = document.getElementById("legend");
    el.innerHTML = B.map(function(b){
      var cls = "hint-chip" + (b.construction ? " c-constr" : "");
      var flTxt = b.construction ? "공사중" : (b.floors + "층");
      return '<button class="'+cls+'" data-id="'+b.id+'"><span class="ic">'+b.ic+'</span>'+b.name+' <span class="fl">'+flTxt+'</span></button>';
    }).join("");
  }

  // ---- detail modal ----
  var backdrop = document.getElementById("backdrop");
  var detail = document.getElementById("detail");
  var lastFocus = null;

  function open(id) {
    var b = B.filter(function(x){ return x.id === id; })[0];
    if (!b) return;
    lastFocus = document.activeElement;
    var flTxt = b.construction ? "공사중 · 곧 오픈" : (b.floors + "층");
    var flCls = b.construction ? "flbadge constr" : "flbadge";
    var html = '';
    html += '<div class="photo">';
    html += '<button class="close" id="dt-close" aria-label="닫기">✕</button>';
    html += '<img src="'+PHOTOS[b.id]+'" alt="'+b.name+' 실제 사진">';
    html += '<div class="grad"></div>';
    html += '<div class="tag"><span class="'+flCls+'">'+ (b.big ? "🏆 " : "") + flTxt+'</span><span class="realtag">📷 실제 사진 (드론)</span></div>';
    html += '</div>';
    html += '<div class="body">';
    html += '<h2 id="dt-name"><span class="ic">'+b.ic+'</span>'+b.name+'</h2>';
    html += '<div class="en">'+b.en+'</div>';
    html += '<p class="blurb">'+b.blurb+'</p>';
    if (b.construction) {
      html += '<div class="constr-note"><span>🚧</span><span>이 건물은 거의 완공되었고, 마무리 공사가 끝나면 곧 이용할 수 있어요.</span></div>';
    }
    html += '<div class="sect">이 건물에서는</div>';
    html += '<ul>' + b.items.map(function(it){
      return '<li><span class="li-ic">'+it[0]+'</span>'+it[1]+'</li>';
    }).join("") + '</ul>';
    html += '</div>';
    detail.innerHTML = html;
    backdrop.classList.add("open");
    document.body.style.overflow = "hidden";
    document.getElementById("dt-close").addEventListener("click", close);
    detail.scrollTop = 0;
    document.getElementById("dt-close").focus();
  }
  function close() {
    backdrop.classList.remove("open");
    document.body.style.overflow = "";
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  backdrop.addEventListener("click", function(e){ if (e.target === backdrop) close(); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && backdrop.classList.contains("open")) close(); });

  // ---- wire up ----
  document.getElementById("mapsvg").innerHTML = svgMap();
  labels();
  legend();

  function delegate(container) {
    container.addEventListener("click", function(e){
      var t = e.target.closest("[data-id]");
      if (t) open(t.getAttribute("data-id"));
    });
    container.addEventListener("keydown", function(e){
      var t = e.target.closest(".bld[data-id]");
      if (t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); open(t.getAttribute("data-id")); }
    });
  }
  delegate(document.getElementById("mapwrap"));
  delegate(document.getElementById("legend"));

  // pop-in stagger
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduce) {
    var groups = document.querySelectorAll(".bld");
    groups.forEach(function(g, i){
      g.classList.add("pop");
      g.querySelector(".lift").style.animationDelay = (0.15 + i*0.12) + "s";
    });
  }
})();
</script>
