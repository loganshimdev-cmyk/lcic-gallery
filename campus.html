<meta property="og:description" content="돌려보고, 눌러보고 — 기숙사에서 목적지까지 걸어가는 LCIC 3D 캠퍼스 지도">

<title>LCIC 캠퍼스 3D 지도 — 어디서 뭘 할까?</title>
<style>
  :root {
    --bg:#eaf2fb; --bg2:#dcebfa; --ink:#12233f; --ink-dim:#4a5b74; --ink-faint:#8595ab;
    --brand:#2563eb; --brand-deep:#1e3a8a; --brand-soft:#e6effe; --yellow:#facc15;
    --card:#ffffff; --hairline:rgba(18,35,63,0.10); --shadow:0 10px 30px rgba(18,35,63,0.14);
    --sky1:#bfe0ff; --sky2:#e8f4ff;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0c1524; --bg2:#0a1220; --ink:#e7eefb; --ink-dim:#9fb0c8; --ink-faint:#64748b;
      --brand:#60a5fa; --brand-deep:#bfdbfe; --brand-soft:#16263f; --card:#131f33;
      --hairline:rgba(231,238,251,0.12); --shadow:0 12px 34px rgba(0,0,0,0.5); --sky1:#12233c; --sky2:#0d1626; }
    body{ background:#0c1524 !important; }
  }
  :root[data-theme="light"]{ --bg:#eaf2fb; --bg2:#dcebfa; --ink:#12233f; --ink-dim:#4a5b74; --ink-faint:#8595ab;
    --brand:#2563eb; --brand-deep:#1e3a8a; --brand-soft:#e6effe; --card:#fff; --hairline:rgba(18,35,63,0.10); --sky1:#bfe0ff; --sky2:#e8f4ff; }
  :root[data-theme="dark"]{ --bg:#0c1524; --bg2:#0a1220; --ink:#e7eefb; --ink-dim:#9fb0c8; --ink-faint:#64748b;
    --brand:#60a5fa; --brand-deep:#bfdbfe; --brand-soft:#16263f; --card:#131f33; --hairline:rgba(231,238,251,0.12); --sky1:#12233c; --sky2:#0d1626; }

  *{ box-sizing:border-box; }
  body{ margin:0; background:radial-gradient(ellipse 90% 60% at 50% 0%, var(--bg2), var(--bg)); color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    -webkit-font-smoothing:antialiased; word-break:keep-all; line-height:1.55; min-height:100dvh; }
  .wrap{ max-width:760px; margin:0 auto; padding:20px 14px 40px; }
  .head{ text-align:center; margin-bottom:12px; }
  .eyebrow{ display:inline-flex; align-items:center; gap:7px; background:var(--brand-soft); color:var(--brand);
    font-size:0.72rem; font-weight:800; letter-spacing:0.12em; padding:5px 13px; border-radius:999px; text-transform:uppercase; }
  .eyebrow .mk{ background:var(--yellow); color:#1e3a8a; font-weight:900; border-radius:5px; padding:1px 6px; letter-spacing:0.04em; }
  h1{ font-size:clamp(1.35rem,5vw,1.85rem); font-weight:900; letter-spacing:-0.02em; margin:12px 0 4px; text-wrap:balance; }
  .head p{ margin:0; color:var(--ink-dim); font-size:0.9rem; }

  .stage{ display:flex; gap:12px; align-items:stretch; }
  .canvas-wrap{ position:relative; flex:1 1 auto; min-width:0; border-radius:20px; overflow:hidden; box-shadow:var(--shadow);
    background:linear-gradient(180deg, var(--sky1), var(--sky2)); aspect-ratio:4/3.4; touch-action:none; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; }
  canvas:active{ cursor:grabbing; }

  .ctrls{ position:absolute; left:10px; bottom:10px; display:flex; gap:6px; z-index:3; }
  .ctrls button{ width:38px; height:38px; border:none; border-radius:11px; background:color-mix(in srgb, var(--card) 88%, transparent);
    color:var(--ink); font-size:1.05rem; font-weight:800; cursor:pointer; box-shadow:0 3px 10px rgba(18,35,63,0.18); backdrop-filter:blur(6px);
    display:grid; place-items:center; transition:transform 0.1s, background 0.15s; }
  .ctrls button:hover{ background:var(--brand); color:#fff; }
  .ctrls button:active{ transform:scale(0.94); }
  .rotate-hint{ position:absolute; right:10px; top:10px; z-index:3; background:color-mix(in srgb, var(--card) 82%, transparent);
    color:var(--ink-dim); font-size:0.72rem; font-weight:700; padding:5px 11px; border-radius:999px; backdrop-filter:blur(6px);
    box-shadow:0 3px 10px rgba(18,35,63,0.12); pointer-events:none; transition:opacity 0.4s; }

  .side{ flex:0 0 158px; display:flex; flex-direction:column; gap:7px; }
  .side .side-h{ font-size:0.72rem; font-weight:800; color:var(--ink-faint); letter-spacing:0.02em; padding:2px 4px 2px; line-height:1.35; }
  .side .side-h b{ color:var(--brand); }
  .place{ display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:var(--card); color:var(--ink);
    border:1.5px solid var(--hairline); border-radius:12px; padding:9px 11px; font-size:0.85rem; font-weight:700; cursor:pointer;
    transition:transform 0.12s, border-color 0.15s, background 0.15s; }
  .place:hover{ transform:translateX(2px); border-color:var(--brand); }
  .place:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }
  .place.active{ background:var(--brand); color:#fff; border-color:var(--brand); }
  .place .ic{ font-size:1.15rem; flex:none; }
  .place .txt{ display:flex; flex-direction:column; line-height:1.18; min-width:0; }
  .place .txt .lb{ font-size:0.85rem; font-weight:800; }
  .place .txt .lo{ font-size:0.67rem; font-weight:600; color:var(--ink-faint); }
  .place.active .txt .lo{ color:rgba(255,255,255,0.82); }
  .place .fl{ margin-left:auto; font-size:0.62rem; font-weight:800; color:var(--brand); background:var(--brand-soft); border-radius:999px; padding:1px 7px; }
  .place.active .fl{ color:#fff; background:rgba(255,255,255,0.25); }
  .place.is-constr .fl{ color:#92610a; background:#fef3c7; }
  .place.is-sport .fl{ color:#15803d; background:#dcfce7; }

  @media (max-width:640px){
    .stage{ flex-direction:column; }
    .side{ flex-basis:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:6px; }
    .side .side-h{ grid-column:1/-1; text-align:center; }
    .place{ font-size:0.8rem; padding:8px 9px; }
    .place .fl{ display:none; }
  }

  .foot{ text-align:center; margin-top:16px; font-size:0.74rem; color:var(--ink-faint); line-height:1.6; }
  .foot b{ color:var(--ink-dim); }

  /* detail modal */
  .backdrop{ position:fixed; inset:0; z-index:90; background:rgba(12,21,36,0.5); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; padding:18px; opacity:0; pointer-events:none; transition:opacity 0.22s; }
  .backdrop.open{ opacity:1; pointer-events:auto; }
  .detail{ background:var(--card); color:var(--ink); width:min(440px,100%); max-height:90dvh; overflow-y:auto; border-radius:22px;
    box-shadow:0 30px 70px rgba(0,0,0,0.4); transform:translateY(24px) scale(0.97); transition:transform 0.28s cubic-bezier(0.2,1,0.3,1); }
  .backdrop.open .detail{ transform:none; }
  .detail .photo{ position:relative; width:100%; aspect-ratio:16/10; background:#0e1a2c; overflow:hidden; border-radius:22px 22px 0 0; }
  .detail .photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .detail .photo .grad{ position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,0.55)); }
  .detail .photo .close{ position:absolute; top:12px; right:12px; z-index:2; width:36px; height:36px; border-radius:50%; border:none;
    background:rgba(0,0,0,0.4); color:#fff; font-size:1.1rem; cursor:pointer; display:grid; place-items:center; backdrop-filter:blur(4px); }
  .detail .photo .close:hover{ background:rgba(0,0,0,0.65); }
  .detail .photo .tag{ position:absolute; left:14px; bottom:12px; z-index:2; display:flex; align-items:center; gap:8px; }
  .detail .photo .tag .flbadge{ background:var(--yellow); color:#1e3a8a; font-weight:900; font-size:0.78rem; padding:3px 11px; border-radius:999px; }
  .detail .photo .tag .flbadge.constr{ background:#f59e0b; color:#fff; } .detail .photo .tag .flbadge.sport{ background:#16a34a; color:#fff; }
  .detail .photo .tag .realtag{ color:rgba(255,255,255,0.9); font-size:0.72rem; font-weight:700; }
  .detail .body{ padding:18px 22px 24px; }
  .detail .body h2{ margin:0; font-size:1.4rem; font-weight:900; letter-spacing:-0.01em; display:flex; align-items:center; gap:9px; }
  .detail .body h2 .ic{ font-size:1.5rem; }
  .detail .en{ color:var(--brand); font-weight:800; font-size:0.82rem; letter-spacing:0.04em; margin:2px 0 0 2px; }
  .detail .blurb{ margin:12px 0 0; color:var(--ink-dim); font-size:0.95rem; }
  .detail .sect{ margin-top:18px; font-size:0.72rem; font-weight:800; letter-spacing:0.06em; color:var(--ink-faint); text-transform:uppercase; }
  .detail ul{ list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .detail li{ display:flex; align-items:center; gap:11px; background:var(--brand-soft); border-radius:12px; padding:11px 14px; font-size:0.94rem; font-weight:600; }
  .detail li .li-ic{ font-size:1.15rem; flex:none; }
  .detail .constr-note{ margin-top:16px; background:repeating-linear-gradient(45deg,#fff8e1,#fff8e1 9px,#fef0c3 9px,#fef0c3 18px);
    border:1.5px solid #f0c000; color:#92610a; border-radius:12px; padding:12px 14px; font-size:0.9rem; font-weight:700; display:flex; gap:9px; align-items:center; }
  @media (max-width:480px){
    .backdrop{ align-items:flex-end; padding:0; }
    .detail{ width:100%; max-height:92dvh; border-radius:22px 22px 0 0; transform:translateY(100%); }
    .detail .photo{ border-radius:22px 22px 0 0; } .backdrop.open .detail{ transform:none; }
  }
</style>

<div class="wrap">
  <header class="head">
    <span class="eyebrow"><span class="mk">LCIC</span> Campus 3D · Cebu</span>
    <h1>우리 캠퍼스, 어디서 뭘 할까?</h1>
    <p>드래그하면 빙글빙글 돌려볼 수 있어요 · 오른쪽에서 하고 싶은 일을 누르면 그곳으로 걸어가요</p>

  <div class="stage">

        <button id="rotR" aria-label="오른쪽으로 회전">⟳</button>
        <button id="zIn" aria-label="확대">＋</button>
        <button id="zOut" aria-label="축소">－</button>
      </div>
    </div>
    <aside class="side" id="side"></aside>
  </div>

  <p class="foot">사진은 <b>실제 캠퍼스 사진</b>이에요 · 현재 캠퍼스는 <b>거의 완공</b> 단계, 신축동은 마무리 공사 중입니다.</p>

    var R=10.9; // world radius incl. courts, worst-case over rotation
    cam.zoom = Math.max(0.5, Math.min(1.5, (W/2 - 14)/(1.42*R*TW)));
  }
  function project(wx,wy,wz){
    var c=Math.cos(cam.rot), s=Math.sin(cam.rot);
    var rx=wx*c-wy*s, ry=wx*s+wy*c;
    return { x:(rx-ry)*TW*cam.zoom+cam.ox, y:(rx+ry)*TH*cam.zoom-(wz||0)*FH*cam.zoom+cam.oy, d:ry };
  }
  function poly(pts,fill,stroke,lw){
    ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
    for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
    ctx.closePath();
    if(fill){ ctx.fillStyle=fill; ctx.fill(); }
    if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.lineJoin="round"; ctx.stroke(); }
  }
  function signedArea(p){ var a=0; for(var i=0;i<p.length;i++){ var j=(i+1)%p.length; a+=p[i].x*p[j].y-p[j].x*p[i].y; } return a; }
  function lerp(a,b,t){ return {x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t}; }

  var theme=function(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); };

  // ---- ground ----
  function fillRectWorld(x0,y0,x1,y1,fill,stroke,lw){
    poly([project(x0,y0,0),project(x1,y0,0),project(x1,y1,0),project(x0,y1,0)], fill, stroke, lw);
  }
  function ellipsePolyZ(cx,cy,rx,ry,n){ var a=[]; for(var i=0;i<n;i++){ var t=i/n*Math.PI*2; a.push(project(cx+rx*Math.cos(t),cy+ry*Math.sin(t),0)); } return a; }
  function pathSeg(ax,ay,bx,by,w,col){ var dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy)||1,nx=-dy/L*w/2,ny=dx/L*w/2;
    poly([project(ax+nx,ay+ny,0),project(bx+nx,by+ny,0),project(bx-nx,by-ny,0),project(ax-nx,ay-ny,0)],col,null); }
  function drawGround(){
    var dark = document.documentElement.getAttribute("data-theme")==="dark" || (window.matchMedia("(prefers-color-scheme: dark)").matches && document.documentElement.getAttribute("data-theme")!=="light");
    var lawn = dark? "#3f7a34":"#84c457", lawnE= dark? "#356b2b":"#6cae42";
    var path = dark? "#39485f":"#ece4d2", pathL= dark? "#45566f":"#dacfb8";
    fillRectWorld(-9.6,-9.8,9.6,10.6, lawn, lawnE, 2);                        // lawn base
    poly(ellipsePolyZ(RING_CX,RING_CY,RING_RX+RING_BW,RING_RY+RING_BW,48), path, pathL, 1.5);   // ring outer (tan)
    poly(ellipsePolyZ(RING_CX,RING_CY,RING_RX-RING_BW,RING_RY-RING_BW,48), lawn, null, 0);       // inner lawn (cut)
    pathSeg(NODE[CN][0],NODE[CN][1],NODE[CS][0],NODE[CS][1],0.95,path);                          // cross: N-S
    pathSeg(NODE[CW][0],NODE[CW][1],NODE[CE][0],NODE[CE][1],0.95,path);                          // cross: E-W
    BUILD.forEach(function(b){ var d=NODE[b.door], r=NODE[b._ring]; pathSeg(d[0],d[1],r[0],r[1],0.9,path); }); // spokes
    pathSeg(6.4,2.8,6.4,4.6,0.8,path);                                     // court connector
    ctx.save(); ctx.setLineDash([3,5]); ctx.globalAlpha=0.55; ctx.strokeStyle=pathL; ctx.lineWidth=1.2;
    var mid=ellipsePolyZ(RING_CX,RING_CY,RING_RX,RING_RY,48); ctx.beginPath(); ctx.moveTo(mid[0].x,mid[0].y);
    for(var i=1;i<mid.length;i++) ctx.lineTo(mid[i].x,mid[i].y); ctx.closePath(); ctx.stroke(); ctx.restore();
    var m=project(RING_CX,RING_CY,0.02); ctx.beginPath(); ctx.ellipse(m.x,m.y,17*cam.zoom,8.5*cam.zoom,0,0,7); ctx.fillStyle=path; ctx.fill();
    ctx.strokeStyle=theme("--brand"); ctx.globalAlpha=0.45; ctx.lineWidth=1.5; ctx.stroke(); ctx.globalAlpha=1;
  }

  // ---- draw a person ----
  function drawPerson(p){
    var base=project(p.x,p.y,0), head=project(p.x,p.y,0.9), z=cam.zoom;
    ctx.beginPath(); ctx.ellipse(base.x,base.y,5.5*z,2.6*z,0,0,7); ctx.fillStyle="rgba(10,20,35,0.22)"; ctx.fill();
    ctx.strokeStyle=p.color; ctx.lineWidth=(p.guide?7:5)*z; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(base.x,base.y-1*z); ctx.lineTo(head.x,head.y); ctx.stroke();
    ctx.beginPath(); ctx.arc(head.x,head.y,(p.guide?5.4:4.2)*z,0,7); ctx.fillStyle="#f3c9a0"; ctx.fill();
    ctx.lineWidth=1; ctx.strokeStyle="rgba(0,0,0,0.15)"; ctx.stroke();
    if(p.guide){
      var by=head.y-14*z-Math.abs(Math.sin(p.bob))*4*z;
      ctx.font=(15*z)+"px serif"; ctx.textAlign="center"; ctx.fillText("📍",head.x,by);
    }
  }

  // ---- draw building / court ----
  var hitPolys=[];
  function drawBuilding(b){
    var dark=document.documentElement.getAttribute("data-theme")==="dark" || (window.matchMedia("(prefers-color-scheme: dark)").matches && document.documentElement.getAttribute("data-theme")!=="light");
    var hw=b.w/2, hd=b.d/2;
    var corn=[[b.x-hw,b.y-hd],[b.x+hw,b.y-hd],[b.x+hw,b.y+hd],[b.x-hw,b.y+hd]];
    if(b.kind==="court"){ drawCourt(b,corn,dark); return; }
    var h=b.floors*0.92;
    var bot=corn.map(function(p){return project(p[0],p[1],0);});
    var top=corn.map(function(p){return project(p[0],p[1],h);});
    // shadow
    ctx.beginPath(); ctx.ellipse((bot[0].x+bot[2].x)/2,(bot[0].y+bot[2].y)/2+6*cam.zoom, b.w*TW*0.6*cam.zoom, b.d*TH*0.7*cam.zoom,0,0,7);
    ctx.fillStyle="rgba(10,20,35,0.14)"; ctx.fill();
    var wallLit = b.construction? "#efe0a6" : (dark?"#3a4b66":"#d7e0ee");
    var wallDim = b.construction? "#e4d190" : (dark?"#2c3a53":"#bcc9db");
    var roofCol = b.construction? "#f0e6bf" : (dark?"#48597a":"#eef3fb");
    var edge = dark? "rgba(0,0,0,0.35)":"rgba(30,50,90,0.22)";
    // walls (front-facing only)
    for(var i=0;i<4;i++){
      var j=(i+1)%4;
      var q=[bot[i],bot[j],top[j],top[i]];
      if(signedArea(q) < 0) continue;
      var rightish = bot[j].x >= bot[i].x;
      poly(q, rightish? wallLit : wallDim, edge, 1);
      var wlen=(i%2===0)?b.w:b.d; if(!b.construction) drawWindows(bot[i],bot[j],top[j],top[i], b.floors, Math.max(3,Math.round(wlen*1.0)), dark);
    }
    // roof
    poly(top, roofCol, edge, 1.2);
    if(b.construction){
      // hatch stripes on roof + crane + text
      ctx.save(); poly(top,null,null); ctx.clip();
      ctx.strokeStyle="rgba(217,119,6,0.55)"; ctx.lineWidth=3;
      for(var k=-6;k<12;k++){ var a=project(b.x-hw+k*0.8,b.y-hd,h), c2=project(b.x-hw+k*0.8+2,b.y+hd,h);
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(c2.x,c2.y); ctx.stroke(); }
      ctx.restore();
      var cr=project(b.x+hw-0.4,b.y-hd,h);
      ctx.strokeStyle="#f59e0b"; ctx.lineWidth=4*cam.zoom; ctx.beginPath(); ctx.moveTo(cr.x,cr.y); ctx.lineTo(cr.x+26*cam.zoom,cr.y-10*cam.zoom); ctx.stroke();
    }
    // icon disc at roof center
    var rc=project(b.x,b.y,h);
    var ring = b.construction? "#f0c000" : theme("--brand");
    ctx.beginPath(); ctx.arc(rc.x,rc.y,15*cam.zoom,0,7); ctx.fillStyle=dark?"#e9eef6":"#fff"; ctx.fill();
    ctx.lineWidth=2.5*cam.zoom; ctx.strokeStyle=ring; ctx.stroke();
    ctx.font=(16*cam.zoom)+"px serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(b.ic,rc.x,rc.y+1);
    ctx.textBaseline="alphabetic";
    hitPolys.push({ b:b, pts: top.concat([bot[2],bot[3]]) , simple: top });
    b._label = project(b.x,b.y,h+0.35);
  }
  function drawWindows(bl,br,tr,tl,floors,cols,dark){
    var wc = dark? "#9fb6d6":"#cfe0f6", ws= dark? "#7f96b8":"#b7cae6";
    for(var r=0;r<floors;r++){
      for(var c=0;c<cols;c++){
        var u0=(c+0.22)/cols, u1=(c+0.78)/cols, v0=(r+0.24)/floors, v1=(r+0.74)/floors;
        var p00=bil(bl,br,tl,tr,u0,v0), p10=bil(bl,br,tl,tr,u1,v0), p11=bil(bl,br,tl,tr,u1,v1), p01=bil(bl,br,tl,tr,u0,v1);
        poly([p00,p10,p11,p01], wc, ws, 0.5);
      }
    }
  }
  function bil(bl,br,tl,tr,u,v){ var b=lerp(bl,br,u), t=lerp(tl,tr,u); return lerp(b,t,v); }

  function drawCourt(b,corn,dark){
    var h=0.16;
    var bot=corn.map(function(p){return project(p[0],p[1],0);});
    var top=corn.map(function(p){return project(p[0],p[1],h);});
    for(var i=0;i<4;i++){ var j=(i+1)%4; var q=[bot[i],bot[j],top[j],top[i]]; if(signedArea(q)<0) continue; poly(q, dark?"#3a4658":"#9aa6b5", "rgba(30,50,90,0.2)",1); }
    var surf= dark?"#556478":"#b7c1cd";
    poly(top, surf, "rgba(30,50,90,0.22)",1.2);
    // markings on top face via bilinear (corn order NW,NE,SE,SW -> top[0..3])
    var tl=top[0], tr=top[1], br=top[2], bl=top[3];
    function P(u,v){ return bil(bl,br,tl,tr,u,v); } // u along width, v along depth (0=bottom/near)
    ctx.strokeStyle="rgba(255,255,255,0.9)"; ctx.lineWidth=1.6;
    // boundary
    poly([P(0.08,0.12),P(0.92,0.12),P(0.92,0.88),P(0.08,0.88)],null,"rgba(255,255,255,0.85)",1.6);
    // center line
    ctx.beginPath(); var a=P(0.5,0.12),c=P(0.5,0.88); ctx.moveTo(a.x,a.y); ctx.lineTo(c.x,c.y); ctx.stroke();
    var cc=P(0.5,0.5);
    if(b.sport!=="volley"){ ctx.beginPath(); ctx.ellipse(cc.x,cc.y,10*cam.zoom,5*cam.zoom,0,0,7); ctx.stroke(); }
    else { ctx.setLineDash([4,3]); ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(c.x,c.y); ctx.stroke(); ctx.setLineDash([]); }
    // icon disc
    var rc=project(b.x,b.y,h+0.02);
    ctx.beginPath(); ctx.arc(rc.x,rc.y,12*cam.zoom,0,7); ctx.fillStyle=dark?"#e9eef6":"#fff"; ctx.fill();
    ctx.lineWidth=2*cam.zoom; ctx.strokeStyle="#16a34a"; ctx.stroke();
    ctx.font=(13*cam.zoom)+"px serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(b.ic,rc.x,rc.y+1); ctx.textBaseline="alphabetic";
    hitPolys.push({ b:b, simple: top });
    b._label = project(b.x,b.y,h+0.5);
  }

  function drawTree(x,y){
    var base=project(x,y,0), t=project(x,y,0.8);
    ctx.beginPath(); ctx.ellipse(base.x,base.y,6*cam.zoom,3*cam.zoom,0,0,7); ctx.fillStyle="rgba(10,20,35,0.18)"; ctx.fill();
    ctx.strokeStyle="#8a6b3f"; ctx.lineWidth=3*cam.zoom; ctx.beginPath(); ctx.moveTo(base.x,base.y); ctx.lineTo(t.x,t.y); ctx.stroke();
    ctx.fillStyle="#3f8f43"; ctx.beginPath(); ctx.arc(t.x,t.y,9*cam.zoom,0,7); ctx.fill();
    ctx.fillStyle="#4aa14d"; ctx.beginPath(); ctx.arc(t.x-6*cam.zoom,t.y+3*cam.zoom,6*cam.zoom,0,7); ctx.arc(t.x+6*cam.zoom,t.y+3*cam.zoom,6*cam.zoom,0,7); ctx.fill();
  }
  function drawBus(x,y){
    var b={x:x,y:y,w:1.4,d:2.4,floors:0.7}; var hw=b.w/2,hd=b.d/2,h=0.7;
    var corn=[[b.x-hw,b.y-hd],[b.x+hw,b.y-hd],[b.x+hw,b.y+hd],[b.x-hw,b.y+hd]];
    var bot=corn.map(function(p){return project(p[0],p[1],0);}), top=corn.map(function(p){return project(p[0],p[1],h);});
    for(var i=0;i<4;i++){ var j=(i+1)%4; var q=[bot[i],bot[j],top[j],top[i]]; if(signedArea(q)<0) continue; poly(q, (bot[j].x>=bot[i].x)?"#facc15":"#e0b40c","rgba(120,90,0,0.4)",1); }
    poly(top,"#fde047","rgba(120,90,0,0.4)",1);
    var rc=project(b.x,b.y,h+0.2); ctx.font=(9*cam.zoom)+"px sans-serif"; ctx.fillStyle="#1e3a8a"; ctx.textAlign="center"; ctx.fillText("🚌 LCIC",rc.x,rc.y);
  }
  function drawGate(){
    var b={x:0,y:9,w:2.4,d:1.2}; var hw=b.w/2,hd=b.d/2,h=1.1;
    var corn=[[b.x-hw,b.y-hd],[b.x+hw,b.y-hd],[b.x+hw,b.y+hd],[b.x-hw,b.y+hd]];
    var bot=corn.map(function(p){return project(p[0],p[1],0);}), top=corn.map(function(p){return project(p[0],p[1],h);});
    for(var i=0;i<4;i++){ var j=(i+1)%4; var q=[bot[i],bot[j],top[j],top[i]]; if(signedArea(q)<0) continue; poly(q,(bot[j].x>=bot[i].x)?"#e7eefb":"#c7d2e2","rgba(30,50,90,0.25)",1); }
    poly(top,"#f2f6fc","rgba(30,50,90,0.25)",1.2);
    var rc=project(b.x,b.y,h+0.25); ctx.font=(11*cam.zoom)+"px sans-serif"; ctx.fillStyle=theme("--brand-deep"); ctx.textAlign="center"; ctx.fillText("정문",rc.x,rc.y);
  }

  // ---- labels ----
  function drawLabels(){
    ctx.textAlign="center"; ctx.textBaseline="middle";
    BUILD.forEach(function(b){
      if(!b._label) return;
      var t=flText(b), name=b.name;
      ctx.font="700 "+(11.5*cam.zoom)+"px Pretendard, sans-serif";
      var tw=ctx.measureText(name).width, fw=ctx.measureText(t).width, pad=7*cam.zoom, gap=5*cam.zoom, fpad=5*cam.zoom;
      var totW=tw+gap+fw+fpad*2+pad*2, hh=19*cam.zoom;
      var x=b._label.x, y=b._label.y-hh/2;
      rrect(x-totW/2,y-hh/2,totW,hh,hh/2, "rgba(255,255,255,0.96)", "rgba(18,35,63,0.12)");
      ctx.fillStyle="#12233f"; ctx.textAlign="left";
      ctx.fillText(name, x-totW/2+pad, y);
      var fx=x-totW/2+pad+tw+gap;
      var fc = b.construction?"#d97706": b.kind==="court"?"#16a34a": theme("--brand");
      rrect(fx-2*cam.zoom, y-hh*0.34, fw+fpad*2, hh*0.68, hh*0.34, fc, null);
      ctx.fillStyle="#fff"; ctx.fillText(t, fx+fpad-2*cam.zoom, y);
      ctx.textAlign="center";
    });
    ctx.textBaseline="alphabetic";
  }
  function rrect(x,y,w,h,r,fill,stroke){
    ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
    if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=1; ctx.stroke(); }
  }

  // ---- people ----
  var people=[], guide=null;
  var COLORS=["#ef4444","#3b82f6","#22c55e","#a855f7","#f97316","#0ea5e9","#ec4899","#14b8a6"];
  function makeWalker(pathNodes, guideMode, targetB){
    var pts=pathNodes.map(function(n){return {x:NODE[n][0], y:NODE[n][1]};});
    return { nodes:pts, seg:0, t:0, speed:(guideMode?1.9:1.1+Math.random()*0.7),
      x:pts[0].x, y:pts[0].y, color: guideMode? "#2563eb": COLORS[(Math.random()*COLORS.length)|0],
      guide:guideMode, target:targetB, bob:Math.random()*6, done:false };
  }
  function spawnAmbient(){
    var a=(Math.random()*NODE.length)|0, b=(Math.random()*NODE.length)|0, tries=0;
    while(b===a && tries++<5) b=(Math.random()*NODE.length)|0;
    people.push(makeWalker(bfs(a,b), false));
  }
  function updateWalker(p,dt){
    p.bob+=dt*7;
    if(p.seg>=p.nodes.length-1){ p.done=true; return; }
    var A=p.nodes[p.seg], B=p.nodes[p.seg+1];
    var dx=B.x-A.x, dy=B.y-A.y, len=Math.hypot(dx,dy)||0.0001;
    p.t += (p.speed*dt)/len;
    while(p.t>=1 && p.seg<p.nodes.length-1){ p.t-=1; p.seg++; A=p.nodes[p.seg]; if(p.seg<p.nodes.length-1){ B=p.nodes[p.seg+1]; dx=B.x-A.x; dy=B.y-A.y; len=Math.hypot(dx,dy)||0.0001; } else { p.t=0; } }
    if(p.seg>=p.nodes.length-1){ p.x=p.nodes[p.nodes.length-1].x; p.y=p.nodes[p.nodes.length-1].y; p.done=true; return; }
    p.x=A.x+(B.x-A.x)*p.t; p.y=A.y+(B.y-A.y)*p.t;
  }

  // route highlight (guide)
  var routePts=null, routeFade=0;
  function setGuideTo(b){
    if(b.id==="dorm"){ openDetail(b); return; }
    var pathNodes=bfs(DORM_NODE, b.door);
    guide=makeWalker(pathNodes, true, b);
    routePts=pathNodes.map(function(n){return {x:NODE[n][0], y:NODE[n][1]};});
    routeFade=1;
  }
  function drawRoute(){
    if(!routePts) return;
    ctx.save(); ctx.globalAlpha=0.9*routeFade;
    ctx.strokeStyle=theme("--brand"); ctx.lineWidth=5*cam.zoom; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.setLineDash([2,7]);
    ctx.beginPath(); var s=project(routePts[0].x,routePts[0].y,0.04); ctx.moveTo(s.x,s.y);
    for(var i=1;i<routePts.length;i++){ var q=project(routePts[i].x,routePts[i].y,0.04); ctx.lineTo(q.x,q.y); }
    ctx.stroke(); ctx.setLineDash([]);
    // destination pin ring
    var e=routePts[routePts.length-1], ep=project(e.x,e.y,0.04);
    ctx.globalAlpha=routeFade; ctx.strokeStyle=theme("--brand"); ctx.lineWidth=2.5*cam.zoom;
    ctx.beginPath(); ctx.ellipse(ep.x,ep.y,14*cam.zoom,7*cam.zoom,0,0,7); ctx.stroke();
    ctx.restore();
  }

  // ---- main render ----
  var last=0, ambientTimer=0;
  function frame(ts){
    requestAnimationFrame(frame);
    var dt=Math.min(0.05,(ts-last)/1000)||0; last=ts;
    ctx.clearRect(0,0,W,H);
    hitPolys=[];
    drawGround();
    drawRoute();

    // update people
    if(!reduceMotion){
      ambientTimer-=dt;
      if(ambientTimer<=0 && people.length<7){ spawnAmbient(); ambientTimer=1.5+Math.random()*1.5; }
      for(var i=people.length-1;i>=0;i--){ updateWalker(people[i],dt); if(people[i].done) people.splice(i,1); }
      if(guide){ updateWalker(guide,dt); if(guide.done){ var tb=guide.target; guide=null; setTimeout(function(){ openDetail(tb); },150); if(routeFade) routeFadeOut=true; } }
    }
    if(routeFadeOut){ routeFade-=dt*0.5; if(routeFade<=0){ routeFade=0; routePts=null; routeFadeOut=false; } }

    // collect drawables (buildings + bus + gate + trees + people) sort by depth
    var items=[];
    BUILD.forEach(function(b){ items.push({ d:project(b.x,b.y,0).d, fn:function(bb){return function(){ drawBuilding(bb); };}(b) }); });
    [[ -6,9 ]].forEach(function(p){ items.push({ d:project(p[0],p[1],0).d, fn:function(){ drawBus(p[0],p[1]); } }); });
    items.push({ d:project(0,9,0).d, fn:drawGate });
    [[-2.6,-5.8],[2.6,-5.8],[-2.6,7.4],[2.6,7.4]].forEach(function(p){ items.push({ d:project(p[0],p[1],0).d, fn:function(){ drawTree(p[0],p[1]); } }); });
    people.forEach(function(p){ items.push({ d:project(p.x,p.y,0).d, fn:function(){ drawPerson(p); } }); });
    if(guide) items.push({ d:project(guide.x,guide.y,0).d, fn:function(){ drawPerson(guide); } });
    items.sort(function(a,b){ return a.d-b.d; });
    items.forEach(function(it){ it.fn(); });

    drawLabels();
  }
  var reduceMotion=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var routeFadeOut=false;

  // ---- interaction ----
  var drag={active:false, x:0, moved:0, rot0:0};
  function ptr(e){ return e.touches? e.touches[0] : e; }
  cv.addEventListener("pointerdown",function(e){ drag.active=true; drag.x=e.clientX; drag.moved=0; drag.rot0=cam.rot; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove",function(e){ if(!drag.active) return; var dx=e.clientX-drag.x; drag.moved+=Math.abs(dx); cam.rot=drag.rot0 + dx*0.008; document.getElementById("rotHint").style.opacity="0"; });
  cv.addEventListener("pointerup",function(e){
    drag.active=false;
    if(drag.moved<6){ hitTest(e.clientX, e.clientY); }
  });
  cv.addEventListener("wheel",function(e){ e.preventDefault(); cam.zoom=Math.max(0.5,Math.min(2.2, cam.zoom*(e.deltaY>0?0.92:1.08))); },{passive:false});
  function hitTest(cx,cy){
    var r=cv.getBoundingClientRect(), px=cx-r.left, py=cy-r.top;
    for(var i=hitPolys.length-1;i>=0;i--){ if(pointIn(hitPolys[i].simple, px,py)){ openDetail(hitPolys[i].b); return; } }
  }
  function pointIn(poly,x,y){ var inside=false; for(var i=0,j=poly.length-1;i<poly.length;j=i++){ var xi=poly[i].x,yi=poly[i].y,xj=poly[j].x,yj=poly[j].y; if(((yi>y)!=(yj>y)) && (x<(xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside; } return inside; }

  document.getElementById("rotL").addEventListener("click",function(){ animRot(cam.rot - Math.PI/4); });
  document.getElementById("rotR").addEventListener("click",function(){ animRot(cam.rot + Math.PI/4); });
  document.getElementById("zIn").addEventListener("click",function(){ cam.zoom=Math.min(2.2,cam.zoom*1.15); });
  document.getElementById("zOut").addEventListener("click",function(){ cam.zoom=Math.max(0.5,cam.zoom*0.87); });
  function animRot(to){ var from=cam.rot, t0=null; function step(ts){ if(t0===null)t0=ts; var k=Math.min(1,(ts-t0)/350); cam.rot=from+(to-from)*(k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2); if(k<1) requestAnimationFrame(step); } requestAnimationFrame(step); }

  // ---- side panel ----
  var side=document.getElementById("side");
  var ACTS = [
    {ic:"💱", label:"환전", loc:"본관", target:"admin"},
    {ic:"🎓", label:"오리엔테이션", loc:"본관 3·4층 · 츠네이시홀", target:"admin"},
    {ic:"🍚", label:"식당", loc:"과학관", target:"science"},
    {ic:"❓", label:"수업·과목 질문", loc:"어학관 3층", target:"lang"},
    {ic:"💪", label:"Gym · 헬스장", loc:"어학관 1층", target:"lang"},
    {ic:"🏀", label:"농구", loc:"농구장", target:"basket"},
    {ic:"🏐", label:"배구", loc:"배구장", target:"volley"},
    {ic:"🛏️", label:"내 방 · 숙소", loc:"기숙사", target:"dorm"}
  ];
  side.innerHTML='<div class="side-h">🧭 <b>기숙사에서 출발</b><br>뭘 하고 싶어요?</div>' + ACTS.map(function(a){
    return '<button class="place" data-target="'+a.target+'"><span class="ic">'+a.ic+'</span><span class="txt"><span class="lb">'+a.label+'</span><span class="lo">'+a.loc+'</span></span></button>';
  }).join("");
  side.addEventListener("click",function(e){
    var t=e.target.closest(".place"); if(!t) return;
    Array.prototype.forEach.call(side.querySelectorAll(".place"),function(x){x.classList.remove("active");});
    t.classList.add("active");
    setGuideTo(byId(t.getAttribute("data-target")));
  });

  // ---- detail modal ----
  var backdrop=document.getElementById("backdrop"), detail=document.getElementById("detail"), lastFocus=null;
  function openDetail(b){
    lastFocus=document.activeElement;
    var flTxt=b.construction?"공사중 · 곧 오픈":flText(b);
    var flCls="flbadge"+(b.construction?" constr":b.kind==="court"?" sport":"");
    var pre=b.big?"🏆 ":"";
    var h='<div class="photo"><button class="close" id="dt-close" aria-label="닫기">✕</button><img src="'+PHOTOS[b.id]+'" alt="'+b.name+'"><div class="grad"></div>';
    h+='<div class="tag"><span class="'+flCls+'">'+pre+flTxt+'</span><span class="realtag">📷 실제 사진</span></div></div>';
    h+='<div class="body"><h2 id="dt-name"><span class="ic">'+b.ic+'</span>'+b.name+'</h2><div class="en">'+b.en+'</div><p class="blurb">'+b.blurb+'</p>';
    if(b.construction) h+='<div class="constr-note"><span>🚧</span><span>이 건물은 거의 완공되었고, 마무리 공사가 끝나면 곧 이용할 수 있어요.</span></div>';
    h+='<div class="sect">이곳에서는</div><ul>'+b.items.map(function(it){return '<li><span class="li-ic">'+it[0]+'</span>'+it[1]+'</li>';}).join('')+'</ul></div>';
    detail.innerHTML=h; backdrop.classList.add("open"); document.body.style.overflow="hidden";
    document.getElementById("dt-close").addEventListener("click",closeDetail); detail.scrollTop=0; document.getElementById("dt-close").focus();
  }
  function closeDetail(){ backdrop.classList.remove("open"); document.body.style.overflow=""; if(lastFocus&&lastFocus.focus) lastFocus.focus(); }
  backdrop.addEventListener("click",function(e){ if(e.target===backdrop) closeDetail(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&backdrop.classList.contains("open")) closeDetail(); });

  // ---- boot ----
  function boot(){ resize(); requestAnimationFrame(frame); for(var i=0;i<4;i++) spawnAmbient(); }
  window.addEventListener("resize",resize);
  boot();
  setTimeout(function(){ var h=document.getElementById("rotHint"); if(h) h.style.opacity="0"; }, 6000);
})();
</script>
