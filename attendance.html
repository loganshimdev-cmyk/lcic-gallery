<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>오리엔테이션 출석 · LCIC</title>
<link rel="icon" type="image/png" href="assets/brand/lcic-logo.png">
<script src="assets/background.js?v=8"></script>
<link rel="stylesheet" href="assets/shared.css?v=13">
<script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
<style>
  .gate { max-width: 400px; margin: 90px auto 0; padding: 36px 32px; background: var(--bg-elev);
    border: 1px solid var(--hairline); border-radius: 24px; box-shadow: var(--shadow-lg); }
  .gate h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 6px; }
  .gate p { color: var(--text-dim); font-size: .85rem; margin-bottom: 20px; }
  .gate input { width: 100%; margin-bottom: 12px; }

  .wrap { max-width: 920px; margin: 0 auto; padding: 28px 20px 100px; }
  .head h1 { font-size: 1.45rem; font-weight: 800; letter-spacing: -.02em; }
  .head .meta { color: var(--text-dim); font-size: .84rem; margin-top: 3px; }

  .count-bar { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0 14px; }
  .count-bar .cbx { display: inline-flex; align-items: center; gap: 7px; padding: 10px 16px; border-radius: 12px;
    background: var(--bg-elev); border: 1px solid var(--hairline); font-size: .88rem; font-weight: 700; box-shadow: var(--shadow-sm); }
  .count-bar .cbx .n { font-weight: 800; font-size: 1.15rem; }
  .count-bar .cbx.pre .n { color: #047857; }
  .count-bar .cbx.abs .n { color: #b91c1c; }
  .count-bar .cbx.tot .n { color: var(--accent-deep); }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .filters { display: inline-flex; padding: 4px; background: rgba(0,0,0,.04); border: 1px solid var(--hairline); border-radius: 999px; }
  .filters button { border: none; background: none; padding: 7px 15px; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: .84rem; color: var(--text-dim); }
  .filters button.active { background: var(--accent); color: #fff; }
  .controls .search { flex: 1; min-width: 180px; }
  .controls .search input { width: 100%; max-width: 320px; }

  .hint { font-size: .78rem; color: var(--text-faint); margin: 0 0 16px; line-height: 1.5; }

  .names { display: flex; flex-wrap: wrap; gap: 9px; }
  .nm { display: inline-flex; align-items: baseline; gap: 6px; padding: 9px 13px; border-radius: 11px;
    background: rgba(0,0,0,.035); border: 1px solid var(--hairline); font-size: .93rem;
    cursor: pointer; user-select: none; transition: background .12s, border-color .12s, box-shadow .12s; }
  .nm:hover { border-color: var(--accent); }
  .nm b { font-weight: 700; }
  .nm .uni { font-size: .68rem; color: var(--text-faint); }
  .nm .st { font-size: .74rem; font-weight: 800; white-space: nowrap; }
  .nm.present { background: rgba(5,150,105,.16); border-color: rgba(5,150,105,.5); }
  .nm.present .st { color: #047857; }
  .nm.hit { box-shadow: 0 0 0 2px rgba(202,138,4,.75); }
  .empty { color: var(--text-faint); text-align: center; padding: 44px 20px; line-height: 1.6; }
</style>
</head>
<body>

<div id="gate-view">
  <div class="gate">
    <h2>✅ 오리엔테이션 출석</h2>
    <p>담당자 전용입니다. 비밀번호를 입력하세요.</p>
    <form id="gate-form">
      <input class="input" id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" required>
      <button class="btn-primary" id="gate-btn" type="submit" style="width:100%;">열기</button>
    </form>
  </div>
</div>

<main id="app-view" class="wrap hidden">
  <div class="head" style="display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap;">
    <div>
      <h1>✅ 오리엔테이션 현장 출석</h1>
      <div class="meta" id="meta"></div>
    </div>
    <a class="btn-primary" href="attendance-display.html" target="_blank" rel="noopener"
       style="text-decoration:none; white-space:nowrap; padding:11px 18px;">📷 QR 출석 화면 열기</a>
  </div>
  <div class="count-bar" id="counts"></div>
  <div class="controls">
    <div class="filters" id="filters">
      <button data-f="all" class="active">전체</button>
      <button data-f="present">출석</button>
      <button data-f="absent">미출석</button>
    </div>
    <div class="search"><input class="input" id="q" type="search" placeholder="이름 검색"></div>
  </div>
  <div class="hint">이름을 누르면 <b style="color:#047857;">✅ 출석</b>으로 표시됩니다. 다시 누르면 해제돼요. 담당자 모두에게 공유되며 15초마다 동기화됩니다.</div>
  <div class="names" id="list"></div>
</main>

<div class="toast" id="toast"></div>

<script type="module">
import { supabase } from "./assets/supabase.js?v=4";

const $ = (id) => document.getElementById(id);
const toast = $("toast");
function showToast(m, t = "") { toast.textContent = m; toast.className = `toast show ${t}`; setTimeout(() => toast.classList.remove("show"), 2600); }
const esc = (s) => (s == null ? "" : String(s)).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

async function decryptBlob(b64, password) {
  const raw = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  const salt = raw.slice(0, 16), iv = raw.slice(16, 28), tag = raw.slice(28, 44), ct = raw.slice(44);
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const data = new Uint8Array(ct.length + tag.length); data.set(ct); data.set(tag, ct.length);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
  return JSON.parse(new TextDecoder().decode(pt));
}

let DATA = null;
let PRESENT = new Set();       // 출석한 학생 id
let ready = false;
let filter = "all";
const TABLE = "attendance";

$("gate-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("gate-btn"); btn.disabled = true; btn.textContent = "여는 중…";
  try {
    DATA = await decryptBlob(window.ATTENDANCE_BLOB, $("pw").value);
    DATA.updated = DATA.updated || window.ATTENDANCE_UPDATED;
    $("gate-view").classList.add("hidden");
    $("app-view").classList.remove("hidden");
    await loadPresent();
    render();
    setInterval(sync, 15000);
  } catch (_) {
    btn.disabled = false; btn.textContent = "열기";
    showToast("비밀번호가 올바르지 않습니다.", "error");
  }
});

async function loadPresent() {
  try {
    const { data, error } = await supabase.from(TABLE).select("id");
    if (error) throw error;
    PRESENT = new Set((data || []).map((r) => r.id));
    ready = true;
  } catch (_) {
    ready = false; PRESENT = new Set();
    showToast("출석 동기화가 아직 준비되지 않았습니다(관리자 SQL 필요).", "error");
  }
}
async function sync() {
  if (!ready) return;
  try {
    const { data, error } = await supabase.from(TABLE).select("id");
    if (error) throw error;
    PRESENT = new Set((data || []).map((r) => r.id));
    applyStates();
  } catch (_) { /* 일시적 오류는 조용히 무시 */ }
}

$("q").addEventListener("input", render);
$("filters").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f;
  $("filters").querySelectorAll("button").forEach((x) => x.classList.toggle("active", x === b));
  render();
});

function updateCounts() {
  const total = DATA.students.length;
  const pre = DATA.students.filter((s) => PRESENT.has(s.id)).length;
  $("counts").innerHTML =
    `<span class="cbx pre">✅ 출석 <span class="n">${pre}</span></span>` +
    `<span class="cbx abs">❌ 미출석 <span class="n">${total - pre}</span></span>` +
    `<span class="cbx tot">전체 <span class="n">${total}</span></span>`;
}
function applyChip(el) {
  const on = PRESENT.has(el.dataset.id);
  el.classList.toggle("present", on);
  const st = el.querySelector(".st"); if (st) st.textContent = on ? "✅ 출석" : "";
}
function applyStates() {
  // 필터가 present/absent면 상태 변화로 목록 자체가 바뀌므로 다시 그림
  if (filter !== "all") { render(); return; }
  document.querySelectorAll("#list .nm").forEach(applyChip);
  updateCounts();
}

async function onClickName(el) {
  if (!ready) { showToast("출석 기능이 아직 켜지지 않았습니다(관리자 SQL 필요).", "error"); return; }
  const id = el.dataset.id;
  const was = PRESENT.has(id);
  if (was) PRESENT.delete(id); else PRESENT.add(id);   // 낙관적 업데이트
  applyChip(el); updateCounts();
  try {
    const res = was
      ? await supabase.from(TABLE).delete().eq("id", id)
      : await supabase.from(TABLE).upsert({ id, updated_at: new Date().toISOString() });
    if (res.error) throw res.error;
    if (filter !== "all") render();   // 필터 보기면 방금 항목이 목록에서 빠지도록
  } catch (_) {
    if (was) PRESENT.add(id); else PRESENT.delete(id);   // 롤백
    applyChip(el); updateCounts();
    showToast("저장 실패 — 다시 시도해 주세요.", "error");
  }
}

$("list").addEventListener("click", (e) => {
  const el = e.target.closest(".nm"); if (el) onClickName(el);
});

function render() {
  const q = ($("q").value || "").trim();
  const total = DATA.students.length;
  $("meta").textContent = `7월 도착 학생 ${total}명 · 가나다순${DATA.updated ? " · 갱신 " + DATA.updated : ""}`;

  const shown = DATA.students.filter((s) => {
    if (q && !s.n.includes(q)) return false;
    if (filter === "present") return PRESENT.has(s.id);
    if (filter === "absent") return !PRESENT.has(s.id);
    return true;
  });

  if (!shown.length) {
    const msg = filter === "absent" ? "미출석 학생이 없습니다. 전원 출석! 🎉"
      : filter === "present" ? "아직 출석한 학생이 없습니다."
      : "검색 결과가 없습니다.";
    $("list").innerHTML = `<div class="empty">${msg}</div>`;
  } else {
    $("list").innerHTML = shown.map((s) => {
      const on = PRESENT.has(s.id);
      return `<span class="nm${on ? " present" : ""}${q ? " hit" : ""}" data-id="${esc(s.id)}"><b>${esc(s.n)}</b>${s.u ? `<span class="uni">${esc(s.u)}</span>` : ""}<span class="st">${on ? "✅ 출석" : ""}</span></span>`;
    }).join("");
  }
  updateCounts();
}
</script>
</body>
</html>
