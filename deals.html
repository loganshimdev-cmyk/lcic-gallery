  .dl-wrap { max-width: 1080px; margin: 0 auto; padding: 108px 16px 80px; }

  .dl-hero { text-align: center; margin-bottom: 30px; }
  .dl-hero h1 { margin: 0 0 10px; font-size: clamp(1.6rem, 4vw, 2.2rem); color: var(--text); letter-spacing: -0.02em; }

  .dl-key { display: flex; align-items: center; gap: 12px; max-width: 620px; margin: 20px auto 0;
    background: #eef3fd; border: 1px solid #d5e2fb; border-radius: 14px; padding: 13px 16px;
    color: var(--accent-deep, #002242); font-size: 0.92rem; font-weight: 700; line-height: 1.55; text-align: left; }
  .dl-key iconify-icon { font-size: 1.5rem; flex-shrink: 0; }

  .dl-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin: 26px 0 18px; }
  .dl-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .dl-chip { border: 1.5px solid var(--line, #dbe3ef); background: #fff; color: var(--text-dim);
    border-radius: 999px; padding: 8px 17px; font-size: 0.89rem; font-weight: 700; cursor: pointer;
    transition: background .15s, color .15s, border-color .15s; }
  .dl-chip:hover { border-color: var(--accent-deep, #002242); color: var(--accent-deep, #002242); }
  .dl-chip.active { background: var(--accent-deep, #002242); border-color: var(--accent-deep, #002242); color: #fff; }
  .dl-count { color: var(--text-faint, #8a94a6); font-size: 0.87rem; font-weight: 600; }

  .dl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(272px, 1fr)); gap: 14px; }
  .dl-card { background: #fff; border: 1px solid var(--line, #e3e9f2); border-radius: 18px;

  .dl-disc { background: #fee2e2; color: #b91c1c; font-weight: 900; font-size: 0.84rem;

  .dl-new { background: #d97706; color: #fff; font-weight: 800; font-size: 0.71rem;

  .dl-sub { color: var(--text-faint, #8a94a6); font-size: 0.81rem; font-weight: 600; }
  .dl-benefit { color: var(--text); font-size: 0.89rem; line-height: 1.55; }
  .dl-note { background: #f6f8fb; border-radius: 10px; padding: 8px 10px; color: var(--text-dim);
    font-size: 0.83rem; line-height: 1.5; }
  .dl-links { display: flex; gap: 7px; flex-wrap: wrap; margin-top: auto; padding-top: 6px; }
  .dl-links a { text-decoration: none; font-size: 0.83rem; font-weight: 700; color: var(--accent-deep, #002242);

<script src="assets/partners.js?v=4"></script>
<script>
// 카드는 JS 로 그리므로 data-i18n 이 안 먹는다. assets/partners.js 의 t 를
// window.lcicLang.t() 로 골라 쓰고, 언어가 바뀌면 통째로 다시 그린다.
(function () {
  const PARTNERS = window.LCIC_PARTNERS || [];
  const grid = document.getElementById("dl-grid");
  const count = document.getElementById("dl-count");
  const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  let currentCat = "all";

  // 번역이 없으면 ja → zh → en → ko 순으로 내려간다(i18n.js 가 처리). 업체 정보는 ko·en·zh·ja 만 있어서
  // 간체는 번체를 화면에서 간체로 바꿔 보여 주고, 베트남어·태국어는 영어로 나온다.
  const pick = (map) => (window.lcicLang ? window.lcicLang.t(map) : map.ko);
  function loc(p, field) {
    const of = (lang) => (p.t && p.t[lang] && p.t[lang][field]) || "";
    return pick({ ko: p[field] || "", en: of("en"), zh: of("zh"), ja: of("ja") });
  }

  function paint() {
    const list = PARTNERS.filter((p) => currentCat === "all" || p.cat === currentCat);
    const unit = pick({ ko: `${list.length}곳`, en: `${list.length} places`, zh: `${list.length} 家`, ja: `${list.length} 店`, "zh-cn": `${list.length} 家`, vi: `${list.length} địa điểm`, th: `${list.length} ร้าน` });
    const mapLabel = pick({ ko: "📍 지도", en: "📍 Map", zh: "📍 地圖", ja: "📍 地図", "zh-cn": "📍 地图", vi: "📍 Bản đồ", th: "📍 แผนที่" });
    const menuFallback = pick({ ko: "🍜 메뉴판", en: "🍜 Menu", zh: "🍜 菜單", ja: "🍜 メニュー", "zh-cn": "🍜 菜单", vi: "🍜 Thực đơn", th: "🍜 เมนู" });
    const telLabel = pick({ ko: "📞 전화", en: "📞 Call", zh: "📞 電話", ja: "📞 電話", "zh-cn": "📞 电话", vi: "📞 Gọi điện", th: "📞 โทร" });

    count.textContent = unit;
    grid.innerHTML = list.map((p) => {
      const note = loc(p, "note");
      return `
      <div class="dl-card">
        <div class="dl-top">
          <div class="dl-name">${esc(loc(p, "name"))}</div>
          <div class="dl-badges">${p.isNew ? '<span class="dl-new">NEW</span>' : ""}<span class="dl-disc">${esc(loc(p, "disc"))}</span></div>
        </div>
        <div class="dl-sub">${esc(loc(p, "sub"))}</div>
        <div class="dl-benefit">${esc(loc(p, "benefit"))}</div>
        ${note ? `<div class="dl-note">💡 ${esc(note)}</div>` : ""}
        <div class="dl-links">
          ${p.map ? `<a href="${esc(p.map)}" target="_blank" rel="noopener">${mapLabel}</a>` : ""}
          ${p.menu ? `<a href="${esc(p.menu)}" target="_blank" rel="noopener">${esc(loc(p, "menuLabel") || menuFallback)}</a>` : ""}
          ${p.tel ? `<a href="tel:${esc(p.tel)}">${telLabel}</a>` : ""}
        </div>
      </div>`;
    }).join("");
  }

  document.getElementById("dl-chips").addEventListener("click", (e) => {
    const b = e.target.closest(".dl-chip"); if (!b) return;
    document.querySelectorAll(".dl-chip").forEach((x) => x.classList.toggle("active", x === b));
    currentCat = b.dataset.cat;
    paint();
  });

  document.addEventListener("lcic:langchange", paint);
  // i18n.js 는 defer 라 이 인라인 스크립트보다 늦게 뜬다 — 준비된 뒤에 그린다.
  document.addEventListener("DOMContentLoaded", paint);
})();
</script>
