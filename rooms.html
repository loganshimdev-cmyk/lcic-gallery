<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>학생 모임 · LCIC</title>
<link rel="icon" type="image/png" href="assets/brand/lcic-logo.png">
<script src="assets/background.js?v=8"></script>
<link rel="stylesheet" href="assets/shared.css?v=13">
<script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
<style>
  .wrap { max-width: 760px; margin: 0 auto; padding: 26px 18px 100px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .head h1 { font-size: 1.45rem; font-weight: 800; letter-spacing: -.02em; }
  .head .sub { color: var(--text-dim); font-size: .86rem; margin-top: 3px; }
  .newbtn { border: none; border-radius: 14px; background: var(--accent); color: #fff; font-family: inherit;
    font-size: .95rem; font-weight: 800; padding: 12px 18px; cursor: pointer; white-space: nowrap; box-shadow: var(--shadow-accent); }
  .newbtn:hover { background: var(--accent-hover); }

  .gate { max-width: 420px; margin: 80px auto 0; padding: 34px 30px; background: var(--bg-elev);
    border: 1px solid var(--hairline); border-radius: 24px; box-shadow: var(--shadow-lg); text-align: center; }
  .gate h2 { font-size: 1.2rem; font-weight: 800; margin-bottom: 8px; }
  .gate p { color: var(--text-dim); font-size: .9rem; line-height: 1.6; margin-bottom: 20px; }

  .sec-label { font-size: .8rem; font-weight: 800; color: var(--text-faint); margin: 24px 2px 10px; letter-spacing: .02em; }

  .room { border: 1px solid var(--hairline); border-radius: 18px; background: var(--bg-elev); box-shadow: var(--shadow-sm);
    padding: 16px 17px; margin-bottom: 13px; }
  .room.closed, .room.past { opacity: .72; }
  .room-top { display: flex; align-items: flex-start; gap: 10px; }
  .room-title { font-size: 1.1rem; font-weight: 800; line-height: 1.35; flex: 1; }
  .room-badge { font-size: .7rem; font-weight: 800; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .room-badge.open { background: var(--accent-soft); color: var(--accent-deep); }
  .room-badge.closed { background: rgba(0,0,0,.06); color: var(--text-dim); }
  .room-badge.full { background: rgba(217,119,6,.14); color: #b45309; }
  .room-badge.past { background: rgba(0,0,0,.06); color: var(--text-faint); }
  .room-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 10px 0 0; font-size: .88rem; color: var(--text); }
  .room-meta span { display: inline-flex; align-items: center; gap: 5px; }
  .room-meta iconify-icon { color: var(--accent); font-size: 16px; }
  .room-note { font-size: .88rem; color: var(--text-dim); margin-top: 9px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; }
  .room-note a { color: var(--accent-deep); font-weight: 700; }
  .room-host { font-size: .78rem; color: var(--text-faint); margin-top: 9px; }
  .room-people { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
  .chip { font-size: .82rem; padding: 5px 10px; border-radius: 9px; background: rgba(0,0,0,.04); border: 1px solid var(--hairline); }
  .chip.host { background: var(--accent-tint); border-color: var(--accent-soft); color: var(--accent-deep); font-weight: 700; }
  .room-count { font-weight: 800; color: var(--accent-deep); }
  .room-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .btn { border: none; border-radius: 11px; font-family: inherit; font-size: .9rem; font-weight: 700; padding: 10px 16px; cursor: pointer; }
  .btn.join { background: var(--accent); color: #fff; } .btn.join:hover { background: var(--accent-hover); }
  .btn.leave { background: rgba(0,0,0,.05); color: var(--text); border: 1px solid var(--hairline); }
  .btn.ghost { background: var(--bg-elev); color: var(--text-dim); border: 1px solid var(--hairline); }
  .btn.danger { background: rgba(220,38,38,.09); color: #b91c1c; border: 1px solid rgba(220,38,38,.3); }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }

  /* 아코디언(제목 클릭 시 상세 펼침) */
  .room-head { display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left;
    background: none; border: none; padding: 0; margin: 0; cursor: pointer; font-family: inherit; color: inherit; }
  .room-head-main { flex: 1; min-width: 0; }
  .room-title-row { display: flex; align-items: flex-start; gap: 10px; }
  .room-head:hover .room-title { color: var(--accent-deep); }
  .room-sub { display: flex; flex-wrap: wrap; gap: 5px 14px; margin-top: 8px; font-size: .86rem; color: var(--text-dim); }
  .room-sub span { display: inline-flex; align-items: center; gap: 5px; }
  .room-sub iconify-icon { color: var(--accent); font-size: 15px; }
  .room-sub .room-count { color: var(--accent-deep); font-weight: 800; }
  .room-chevron { color: var(--text-faint); font-size: 20px; flex-shrink: 0; margin-top: 2px; transition: transform .2s; }
  .room.open .room-chevron { transform: rotate(180deg); }
  .room-body { display: none; margin-top: 13px; padding-top: 13px; border-top: 1px solid var(--hairline); }
  .room.open .room-body { display: block; }

  /* 관심·공식·오픈채팅·안내 */
  .room-badge.official { background: rgba(37,99,235,.12); color: #1d4ed8; }
  .room-sub .sub-interest iconify-icon { color: #e11d48; }
  .room-sub .sub-interest b { color: #e11d48; font-weight: 800; }
  .btn.chat { background: #FEE500; color: #191600; text-decoration: none; display: inline-flex; align-items: center; }
  .btn.chat:hover { background: #f4dc00; }
  .room-hint { margin-top: 9px; font-size: .82rem; color: var(--text-faint); }
  .list-hint { font-size: .86rem; color: var(--accent-deep); background: var(--accent-tint);
    border: 1px solid var(--accent-soft); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; line-height: 1.55; }
  .chk-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 700; }
  .chk-label input { width: auto; }

  /* 모임 채팅 */
  .chat { margin-top: 14px; border-top: 1px dashed var(--hairline); padding-top: 12px; }
  .chat-label { font-size: .8rem; font-weight: 800; color: var(--text-faint); margin-bottom: 8px; }
  .chat-msgs { max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 2px; }
  .chat-empty { color: var(--text-faint); font-size: .85rem; text-align: center; padding: 14px 0; }
  .msg { max-width: 82%; align-self: flex-start; }
  .msg.me { align-self: flex-end; }
  .msg-name { font-size: .7rem; color: var(--text-faint); margin: 0 6px 2px; }
  .msg.me .msg-name { text-align: right; }
  .msg-body { display: inline-block; font-size: .9rem; line-height: 1.45; padding: 8px 12px; border-radius: 14px;
    background: rgba(0,0,0,.05); word-break: break-word; white-space: pre-wrap; }
  .msg.me .msg-body { background: var(--accent); color: #fff; }
  .msg-body a { color: var(--accent-deep); font-weight: 700; }
  .msg.me .msg-body a { color: #fff; text-decoration: underline; }
  .chat-form { display: flex; gap: 8px; margin-top: 10px; }
  .chat-in { flex: 1; padding: 10px 13px; font-size: .92rem; font-family: inherit; color: var(--text);
    border: 1px solid var(--hairline-strong); border-radius: 12px; background: var(--bg); box-sizing: border-box; }
  .chat-in:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .chat-send { border: none; border-radius: 12px; background: var(--accent); color: #fff; font-family: inherit;
    font-weight: 700; padding: 0 16px; cursor: pointer; white-space: nowrap; }
  .chat-send:hover { background: var(--accent-hover); }
  .chat-send[disabled] { opacity: .5; cursor: not-allowed; }
  .chat-locked { margin-top: 10px; font-size: .82rem; line-height: 1.6; color: var(--text-faint); text-align: center;
    background: rgba(0,0,0,.03); border: 1px dashed var(--hairline); border-radius: 12px; padding: 11px 12px; }
  .chat-locked b { color: var(--accent-deep); }

  /* 🗨️ 전체 자유 수다방 위젯 */
  .campus-fab { position: fixed; right: 20px; bottom: 20px; z-index: 9500; width: 56px; height: 56px; border-radius: 50%;
    border: none; background: var(--accent); color: #fff; font-size: 24px; cursor: pointer; box-shadow: 0 10px 28px rgba(15,23,42,.28); }
  .campus-fab:hover { background: var(--accent-hover); }
  .campus-fab .campus-dot { position: absolute; top: 10px; right: 11px; width: 12px; height: 12px; border-radius: 50%;
    background: #ef4444; border: 2px solid #fff; }
  .campus-panel { position: fixed; right: 20px; bottom: 88px; z-index: 9500; width: 340px; max-width: calc(100vw - 32px);
    height: min(460px, 68vh); display: flex; flex-direction: column; background: var(--bg-elev);
    border: 1px solid var(--hairline); border-radius: 20px; box-shadow: 0 24px 60px rgba(15,23,42,.3); overflow: hidden; }
  .campus-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px;
    font-size: 1.05rem; font-weight: 800; color: var(--accent-deep); }
  .campus-x { border: none; background: none; font-size: 16px; color: var(--text-faint); cursor: pointer; }
  .campus-note { font-size: .76rem; color: var(--text-faint); padding: 0 16px 8px; }
  .campus-msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 8px 14px; }
  .campus-form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--hairline); }
  .campus-in { flex: 1; padding: 10px 13px; font-size: .92rem; font-family: inherit; color: var(--text);
    border: 1px solid var(--hairline-strong); border-radius: 12px; background: var(--bg); box-sizing: border-box; }
  .campus-in:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .campus-send { border: none; border-radius: 12px; background: var(--accent); color: #fff; font-family: inherit; font-weight: 700; padding: 0 15px; cursor: pointer; }
  .campus-msgs .cmx { border: none; background: none; color: #c0392b; cursor: pointer; font-size: 11px; margin-left: 6px; }
  @media (max-width: 560px) {
    .campus-panel { right: 12px; left: 12px; width: auto; bottom: 84px; height: min(70vh, 520px); }
    .campus-fab { right: 16px; bottom: 16px; }
  }

  .empty { color: var(--text-faint); text-align: center; padding: 46px 20px; line-height: 1.7; }

  /* 📢 상단 고정 공지 배너 */
  .pin-notice { border: 1px solid rgba(2,132,199,0.32); border-radius: 18px; box-shadow: var(--shadow-sm);
    background: linear-gradient(135deg, rgba(14,165,233,0.08), rgba(59,130,246,0.06)); padding: 16px 17px; margin: 14px 0 18px; }
  .pin-notice .pn-title { font-size: 1.05rem; font-weight: 800; color: #0369a1; margin-bottom: 8px; }
  .pin-notice .pn-body { font-size: .9rem; color: var(--text); line-height: 1.65; }
  .pin-notice .pn-body b { color: #0369a1; }
  .pin-notice .pn-btn { display: inline-block; margin-top: 12px; padding: 11px 18px; border-radius: 12px;
    background: #0284c7; color: #fff; font-weight: 800; font-size: .92rem; text-decoration: none; }
  .pin-notice .pn-btn:hover { background: #0369a1; }

  .modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,.45); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; z-index: 9000; padding: 18px; }
  .modal { background: var(--bg-elev); border-radius: 22px; padding: 24px; max-width: 460px; width: 100%; max-height: 90vh; overflow: auto;
    box-shadow: 0 24px 60px rgba(15,23,42,.28); }
  .modal h3 { font-size: 1.2rem; font-weight: 800; margin-bottom: 16px; }
  .fld { margin-bottom: 13px; }
  .fld label { display: block; font-size: .8rem; font-weight: 700; color: var(--text-dim); margin-bottom: 6px; }
  .fld input, .fld textarea { width: 100%; padding: 11px 13px; font-size: .95rem; font-family: inherit; color: var(--text);
    border: 1px solid var(--hairline-strong); border-radius: 12px; background: var(--bg); box-sizing: border-box; }
  .fld input:focus, .fld textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .fld textarea { resize: vertical; min-height: 56px; }
  .fld .row { display: flex; gap: 10px; } .fld .row > * { flex: 1; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
</style>
</head>
<body>

<!-- 로그인 안내 게이트 (학생 신원 없음) -->
<div id="gate" class="hidden">
  <div class="gate">
    <h2>🏀 학생 모임</h2>
    <p>모임을 보고 참여하려면 먼저 <b>학생 안내 페이지</b>에서 로그인해 주세요.<br>(이메일 · 생년월일 · 휴대폰 뒤 4자리)</p>
    <a class="newbtn" href="status.html" style="display:inline-block; text-decoration:none;">학생 안내 페이지로 이동</a>
  </div>
</div>

<main id="app" class="wrap hidden">
  <div class="head">
    <div>
      <h1>🏀 학생 모임</h1>
      <div class="sub" id="sub">같이 놀 사람 찾기 — 농구, 그랩 같이 타기, 쇼핑 등 자유롭게!</div>
    </div>
    <button class="newbtn" id="new-btn">+ 새 모임 만들기</button>
  </div>
  <div id="pin-notice" style="display:none"></div>
  <div id="list"></div>
</main>

<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<!-- 🗨️ 전체 자유 수다방 (우측 하단 위젯) -->
<button id="campus-fab" class="campus-fab" aria-label="자유 수다방 열기">🗨️<span class="campus-dot" id="campus-dot" hidden></span></button>
<section id="campus-panel" class="campus-panel" hidden aria-label="자유 수다방">
  <div class="campus-head"><span>🗨️ 자유 수다방</span><button id="campus-close" class="campus-x" aria-label="닫기">✕</button></div>
  <div class="campus-note">분실물·질문·잡담 편하게 남겨요! (실명으로 표시돼요)</div>
  <div class="campus-msgs" id="campus-msgs"></div>
  <form class="campus-form" id="campus-form">
    <input class="campus-in" id="campus-in" maxlength="300" placeholder="메시지 보내기…" autocomplete="off">
    <button class="campus-send" type="submit">전송</button>
  </form>
</section>

<script type="module">
import { supabase } from "./assets/supabase.js?v=4";

const $ = (id) => document.getElementById(id);
const toast = $("toast");
const showToast = (m, t = "") => { toast.textContent = m; toast.className = `toast show ${t}`; setTimeout(() => toast.classList.remove("show"), 2600); };
const esc = (s) => (s == null ? "" : String(s)).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const linkify = (s) => esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');   // 설명 속 URL 클릭 가능
const ADMIN = new URLSearchParams(location.search).get("admin") === "1";
const OPEN = new Set();   // 펼쳐진 모임 id (자동갱신에도 유지)
const MSGS = {};          // room_id → 메시지 배열(캐시)
const DRAFTS = {};        // room_id → 입력 중인 초안(재렌더에도 유지)

async function sha256hex(str) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
}
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function nowHM() { const d = new Date(); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }
const WD = ["일", "월", "화", "수", "목", "금", "토"];
function fmtDate(iso) { if (!iso) return ""; const [y, m, d] = iso.split("-").map(Number); const wd = WD[new Date(y, m - 1, d).getDay()]; return `${m}/${d}(${wd})`; }

let ME = null;               // { n, e, id }
let ROOMS = [], JOINS = [], INTERESTS = [];

// 📢 상단 고정 공지 — show:true 로 바꾸면 노출됩니다.
const PIN_NOTICE = {
  show: false,
  title: "🏝 피크데이 호핑투어 · 7월 19일 (일) · 선착순 28명",
  body: `클럽보다 즐거운 <b>피크데이 호핑투어</b>를 학교 단체 특가로 준비했어요!<br>
<b>₱3,300</b> (실제 판매가 ₱4,000 상당 — 인터넷에 없는 우리 학생 전용가)<br>
씨뷰 레스토랑 점심 · 제트스키 · 고프로 수중촬영·사진 제공 · 라면/과일/스낵/음료/맥주 · 섬 입장료까지 <b>전부 포함</b>, 몸만 오세요!<br>
<b>체험다이빙 추가 옵션 ₱1,100</b> (네이버 가격 ₱2,500 이상 · 선착순 8명 · 따로 카톡 주세요)`,
  btnText: "신청하러 가기 (학생 안내 페이지)",
  btnHref: "status.html",
};
(function renderPinNotice() {
  if (!PIN_NOTICE.show) return;
  const el = $("pin-notice"); if (!el) return;
  el.innerHTML = `<div class="pin-notice">
    <div class="pn-title">${PIN_NOTICE.title}</div>
    <div class="pn-body">${PIN_NOTICE.body}</div>
    ${PIN_NOTICE.btnHref ? `<a class="pn-btn" href="${PIN_NOTICE.btnHref}">${PIN_NOTICE.btnText}</a>` : ""}
  </div>`;
  el.style.display = "";
})();

async function initIdentity() {
  if (ADMIN) return true;
  let me = null; try { me = JSON.parse(localStorage.getItem("lcic.me") || "null"); } catch (_) {}
  if (!me || !me.e) return false;
  ME = { n: me.n || "학생", e: me.e, id: (await sha256hex(String(me.e).trim().toLowerCase())).slice(0, 16) };
  return true;
}

async function load() {
  const [r1, r2, r3] = await Promise.all([
    supabase.from("rooms").select("*"),
    supabase.from("room_joins").select("room_id,student_id,name"),
    supabase.from("room_interests").select("room_id,student_id,name"),
  ]);
  if (r1.error || r2.error) throw (r1.error || r2.error);
  ROOMS = r1.data || []; JOINS = r2.data || []; INTERESTS = r3.error ? [] : (r3.data || []);
}
const joinsOf = (rid) => JOINS.filter((j) => j.room_id === rid);
const interestsOf = (rid) => INTERESTS.filter((x) => x.room_id === rid);

// ── 모임 채팅 (열린 방만 폴링) ──
async function fetchMessages(roomIds) {
  if (!roomIds || !roomIds.length) return;
  const { data, error } = await supabase.from("room_messages")
    .select("room_id,student_id,name,body,created_at")
    .in("room_id", roomIds)
    .order("created_at", { ascending: false })
    .limit(300);
  if (error) return;   // 테이블 없거나 일시 오류는 조용히 무시
  const g = {};
  (data || []).forEach((m) => { (g[m.room_id] = g[m.room_id] || []).unshift(m); });   // unshift → 오름차순
  roomIds.forEach((rid) => { MSGS[rid] = g[rid] || []; });
}
function renderMessages(roomId) {
  const el = document.getElementById("cm-" + roomId); if (!el) return;
  const msgs = MSGS[roomId] || [];
  const meId = ME ? ME.id : "official";
  el.innerHTML = msgs.length
    ? msgs.map((m) => `<div class="msg ${m.student_id === meId ? "me" : ""}"><div class="msg-name">${esc(m.name)}</div><div class="msg-body">${linkify(m.body)}</div></div>`).join("")
    : `<div class="chat-empty">아직 대화가 없어요. 먼저 인사해 보세요 👋</div>`;
  el.scrollTop = el.scrollHeight;
}

function roomCard(r) {
  const joins = joinsOf(r.id);
  const n = joins.length;
  const cap = r.capacity || 0;
  const mine = ME && joins.some((j) => j.student_id === ME.id);
  const isHost = ME && r.host_id === ME.id;
  const closed = r.status === "closed";
  const deleted = r.status === "deleted";
  const full = cap > 0 && n >= cap && !mine;
  const past = r.event_date && r.event_date < todayStr();
  const interests = interestsOf(r.id);
  const iCount = interests.length;
  const myInterest = ME && interests.some((x) => x.student_id === ME.id);
  const officialBadge = r.official ? `<span class="room-badge official">🏫 공식</span>` : "";

  const badge = deleted ? `<span class="room-badge past">삭제됨</span>`
    : past ? `<span class="room-badge past">지난 모임</span>`
    : closed ? `<span class="room-badge closed">모집 마감</span>`
    : full ? `<span class="room-badge full">정원 마감</span>`
    : `<span class="room-badge open">모집중</span>`;
  const capText = cap > 0 ? `<span class="room-count">${n}</span> / ${cap}명` : `<span class="room-count">${n}</span>명`;

  // 접힌 요약(제목 밑 한 줄): 날짜 · 시간 · 인원
  const sum = [];
  if (r.event_date) sum.push(`<span><iconify-icon icon="solar:calendar-bold-duotone"></iconify-icon>${fmtDate(r.event_date)}</span>`);
  if (r.event_time) sum.push(`<span><iconify-icon icon="solar:clock-circle-bold-duotone"></iconify-icon>${esc(r.event_time)}</span>`);
  sum.push(`<span><iconify-icon icon="solar:users-group-rounded-bold-duotone"></iconify-icon>${capText}</span>`);
  if (iCount) sum.push(`<span class="sub-interest"><iconify-icon icon="solar:heart-bold-duotone"></iconify-icon>관심 <b>${iCount}</b></span>`);
  // 펼쳤을 때 장소
  const placeMeta = r.place ? `<div class="room-meta"><span><iconify-icon icon="solar:map-point-bold-duotone"></iconify-icon>${esc(r.place)}</span></div>` : "";

  const people = joins
    .sort((a, b) => (a.student_id === r.host_id ? -1 : b.student_id === r.host_id ? 1 : 0))
    .map((j) => `<span class="chip ${j.student_id === r.host_id ? "host" : ""}">${esc(j.name)}${j.student_id === r.host_id ? " (주최)" : ""}</span>`).join("");

  let actions = "";
  if (ADMIN) {
    actions = deleted
      ? `<button class="btn join" data-act="restore" data-id="${r.id}">복구</button><button class="btn danger" data-act="purge" data-id="${r.id}">완전삭제</button>`
      : `<button class="btn danger" data-act="del" data-id="${r.id}">삭제</button>`;
  } else {
    if (past) actions = `<button class="btn ghost" disabled>종료된 모임</button>`;
    else if (closed) actions = `<button class="btn ghost" disabled>모집 마감됨</button>`;
    else if (mine) actions = `<button class="btn leave" data-act="leave" data-id="${r.id}">나가기</button>`;
    else if (full) actions = `<button class="btn ghost" disabled>정원 마감</button>`;
    else actions = `<button class="btn join" data-act="join" data-id="${r.id}">참여하기</button>`;
    if (isHost) {
      if (!past) actions += closed
        ? `<button class="btn ghost" data-act="reopen" data-id="${r.id}">다시 열기</button>`
        : `<button class="btn ghost" data-act="close" data-id="${r.id}">모집 마감</button>`;
      actions += `<button class="btn danger" data-act="del" data-id="${r.id}">삭제</button>`;
    }
    if (!past && !deleted) {
      actions += myInterest
        ? `<button class="btn ghost" data-act="uninterest" data-id="${r.id}">관심 취소</button>`
        : `<button class="btn ghost" data-act="interest" data-id="${r.id}">👀 관심있어요</button>`;
    }
  }
  const chatBtn = (r.chat_url && !deleted) ? `<a class="btn chat" href="${esc(r.chat_url)}" target="_blank" rel="noopener">💬 단톡방 입장</a>` : "";
  const joinable = !ADMIN && !past && !deleted && !closed && !full && !mine;
  const canChat = ADMIN || mine || myInterest;   // 쓰기=참여자·관심자(운영진 포함), 읽기는 누구나

  const isOpen = OPEN.has(r.id);
  return `<div class="room ${closed ? "closed" : ""} ${past || deleted ? "past" : ""} ${isOpen ? "open" : ""}" data-id="${esc(r.id)}">
    <button type="button" class="room-head" aria-expanded="${isOpen ? "true" : "false"}">
      <div class="room-head-main">
        <div class="room-title-row"><span class="room-title">${esc(r.title)}</span>${officialBadge}${badge}</div>
        <div class="room-sub">${sum.join("")}</div>
      </div>
      <iconify-icon class="room-chevron" icon="solar:alt-arrow-down-linear"></iconify-icon>
    </button>
    <div class="room-body">
      ${placeMeta}
      ${r.note ? `<div class="room-note">${linkify(r.note)}</div>` : ""}
      ${r.host_name ? `<div class="room-host">주최: ${esc(r.host_name)}</div>` : ""}
      ${people ? `<div class="room-people">${people}</div>` : ""}
      <div class="room-actions">${actions}${chatBtn}</div>
      ${joinable ? `<div class="room-hint">부담되면 <b>관심있어요</b>만 눌러도 돼요 🙂</div>` : ""}
      ${!deleted ? `<div class="chat">
        <div class="chat-label">💬 모임 채팅</div>
        <div class="chat-msgs" id="cm-${esc(r.id)}"></div>
        ${canChat
          ? `<form class="chat-form" data-room="${esc(r.id)}">
          <input class="chat-in" maxlength="300" placeholder="메시지 보내기…" autocomplete="off">
          <button class="chat-send" type="submit">전송</button>
        </form>`
          : `<div class="chat-locked">💬 <b>참여하기</b> 또는 <b>👀 관심있어요</b>를 누르면 채팅을 쓸 수 있어요<br>(읽기는 자유롭게!)</div>`}
      </div>` : ""}
    </div>
  </div>`;
}

function render() {
  let rooms = ROOMS.slice()
    .sort((a, b) => ((a.event_date || "9999-99-99") + (a.event_time || "99:99")).localeCompare((b.event_date || "9999-99-99") + (b.event_time || "99:99")));
  const deleted = ADMIN ? rooms.filter((r) => r.status === "deleted") : [];
  rooms = rooms.filter((r) => r.status !== "cancelled" && r.status !== "deleted");
  const today = todayStr();
  const upcoming = rooms.filter((r) => !r.event_date || r.event_date >= today);
  upcoming.sort((a, b) => (b.official ? 1 : 0) - (a.official ? 1 : 0));   // 공식(운영진) 모임 상단
  const past = rooms.filter((r) => r.event_date && r.event_date < today);

  let html = "";
  if (!ADMIN) html += `<div class="list-hint">💛 <b>1~2명이어도 좋아요!</b> 부담 없이 모임을 올리거나 <b>관심있어요</b>로 가볍게 참여해 보세요.</div>`;
  if (!rooms.length && !deleted.length) {
    html = `<div class="empty">아직 만들어진 모임이 없어요.<br>${ADMIN ? "" : "위 <b>+ 새 모임 만들기</b>로 첫 모임을 열어보세요!"}</div>`;
  } else {
    if (upcoming.length) html += upcoming.map(roomCard).join("");
    else if (!ADMIN) html += `<div class="empty">예정된 모임이 없어요. 새 모임을 만들어보세요!</div>`;
    if (past.length) html += `<div class="sec-label">지난 모임</div>` + past.map(roomCard).join("");
    if (deleted.length) html += `<div class="sec-label">🗑️ 삭제된 모임 (복구 가능 · 관리자 전용)</div>` + deleted.map(roomCard).join("");
  }
  $("list").innerHTML = html;
  // 열린 방 채팅: 캐시로 즉시 렌더 + 초안 복원 + 최신 조회
  const openChats = [...OPEN].filter((rid) => document.getElementById("cm-" + rid));
  openChats.forEach(renderMessages);
  openChats.forEach((rid) => { const inp = document.querySelector(`.chat-form[data-room="${rid}"] .chat-in`); if (inp && DRAFTS[rid]) inp.value = DRAFTS[rid]; });
  if (openChats.length) fetchMessages(openChats).then(() => openChats.forEach(renderMessages));
}

// ── 아코디언 토글(제목 클릭) ──
$("list").addEventListener("click", (e) => {
  const head = e.target.closest(".room-head"); if (!head) return;
  const room = head.closest(".room"); const id = room.dataset.id;
  if (OPEN.has(id)) OPEN.delete(id); else OPEN.add(id);
  const open = OPEN.has(id);
  room.classList.toggle("open", open);
  head.setAttribute("aria-expanded", open ? "true" : "false");
  if (open) { renderMessages(id); fetchMessages([id]).then(() => renderMessages(id)); }   // 채팅 로드
});

// ── 채팅 전송 ──
$("list").addEventListener("submit", async (e) => {
  const form = e.target.closest(".chat-form"); if (!form) return;
  e.preventDefault();
  const roomId = form.dataset.room;
  const input = form.querySelector(".chat-in");
  const body = (input.value || "").trim(); if (!body) return;
  const btn = form.querySelector(".chat-send"); btn.disabled = true;
  try {
    const { error } = await supabase.from("room_messages").insert({
      room_id: roomId, student_id: ME ? ME.id : "official", name: ME ? ME.n : "LCIC 운영진", body,
    });
    if (error) throw error;
    input.value = ""; DRAFTS[roomId] = "";
    await fetchMessages([roomId]); renderMessages(roomId);
  } catch (_) { showToast("전송 실패 — 다시 시도해 주세요.", "error"); }
  btn.disabled = false; input.focus();
});
// 입력 중 초안 보존(재렌더에도 유지)
$("list").addEventListener("input", (e) => {
  const input = e.target.closest(".chat-in"); if (!input) return;
  const form = input.closest(".chat-form"); if (form) DRAFTS[form.dataset.room] = input.value;
});
// 열린 방 채팅 폴링(4초)
setInterval(async () => {
  const openChats = [...OPEN].filter((rid) => document.getElementById("cm-" + rid));
  if (!openChats.length) return;
  await fetchMessages(openChats);
  openChats.forEach(renderMessages);
}, 4000);

// ── 🗨️ 전체 자유 수다방 ──
const CAMPUS_TABLE = "campus_messages";
let CAMPUS = [], campusOpen = false, campusTimer = null;
const campusSeen = () => { try { return +(localStorage.getItem("lcic.campus.seen") || 0); } catch (_) { return 0; } };
const setCampusSeen = (id) => { try { localStorage.setItem("lcic.campus.seen", String(id)); } catch (_) {} };
async function loadCampus() {
  const { data, error } = await supabase.from(CAMPUS_TABLE).select("id,student_id,name,body,created_at").order("id", { ascending: false }).limit(200);
  if (error) return;
  CAMPUS = (data || []).slice().reverse();
}
function renderCampus() {
  const el = $("campus-msgs"); if (!el) return;
  const meId = ME ? ME.id : "official";
  el.innerHTML = CAMPUS.length
    ? CAMPUS.map((m) => `<div class="msg ${m.student_id === meId ? "me" : ""}"><div class="msg-name">${esc(m.name)}${ADMIN ? ` <button class="cmx" data-cmid="${m.id}">삭제</button>` : ""}</div><div class="msg-body">${linkify(m.body)}</div></div>`).join("")
    : `<div class="chat-empty">첫 메시지를 남겨보세요 👋<br>분실물·질문·잡담 환영이에요!</div>`;
  el.scrollTop = el.scrollHeight;
  if (CAMPUS.length) setCampusSeen(CAMPUS[CAMPUS.length - 1].id);
}
async function checkCampusUnread() {
  const { data } = await supabase.from(CAMPUS_TABLE).select("id").order("id", { ascending: false }).limit(1);
  const newest = data && data[0] ? data[0].id : 0;
  const dot = $("campus-dot"); if (dot) dot.hidden = !(newest > campusSeen() && !campusOpen);
}
function openCampus() {
  campusOpen = true; $("campus-panel").hidden = false; $("campus-dot").hidden = true;
  loadCampus().then(renderCampus);
  campusTimer = setInterval(() => loadCampus().then(renderCampus), 5000);
  setTimeout(() => $("campus-in").focus(), 60);
}
function closeCampus() { campusOpen = false; $("campus-panel").hidden = true; clearInterval(campusTimer); campusTimer = null; checkCampusUnread(); }
$("campus-fab").addEventListener("click", () => (campusOpen ? closeCampus() : openCampus()));
$("campus-close").addEventListener("click", closeCampus);
$("campus-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const inp = $("campus-in"); const body = (inp.value || "").trim(); if (!body) return;
  const btn = e.target.querySelector(".campus-send"); btn.disabled = true;
  try {
    const { error } = await supabase.from(CAMPUS_TABLE).insert({ student_id: ME ? ME.id : "official", name: ME ? ME.n : "LCIC 운영진", body });
    if (error) throw error;
    inp.value = ""; await loadCampus(); renderCampus();
  } catch (_) { showToast("전송 실패 — 다시 시도해 주세요.", "error"); }
  btn.disabled = false; inp.focus();
});
$("campus-msgs").addEventListener("click", async (e) => {
  const x = e.target.closest(".cmx"); if (!x || !ADMIN) return;
  if (!confirm("이 메시지를 삭제할까요?")) return;
  await supabase.from(CAMPUS_TABLE).delete().eq("id", x.dataset.cmid);
  await loadCampus(); renderCampus();
});
setInterval(() => { if (!campusOpen) checkCampusUnread(); }, 20000);
checkCampusUnread();

// ── 액션 ──
$("list").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const id = b.dataset.id, act = b.dataset.act;
  const room = ROOMS.find((r) => r.id === id); if (!room) return;
  b.disabled = true;
  try {
    if (act === "join") {
      const cap = room.capacity || 0, n = joinsOf(id).length;
      if (cap > 0 && n >= cap) { showToast("정원이 찼어요.", "error"); await refresh(); return; }
      const { error } = await supabase.from("room_joins").upsert({ room_id: id, student_id: ME.id, name: ME.n });
      if (error) throw error;
    } else if (act === "leave") {
      const { error } = await supabase.from("room_joins").delete().eq("room_id", id).eq("student_id", ME.id);
      if (error) throw error;
    } else if (act === "interest") {
      const { error } = await supabase.from("room_interests").upsert({ room_id: id, student_id: ME.id, name: ME.n });
      if (error) throw error;
    } else if (act === "uninterest") {
      const { error } = await supabase.from("room_interests").delete().eq("room_id", id).eq("student_id", ME.id);
      if (error) throw error;
    } else if (act === "close" || act === "reopen") {
      const { error } = await supabase.from("rooms").update({ status: act === "close" ? "closed" : "open" }).eq("id", id);
      if (error) throw error;
    } else if (act === "del") {
      if (!confirm("이 모임을 삭제할까요? (관리자가 다시 복구할 수 있어요)")) { b.disabled = false; return; }
      const { error } = await supabase.from("rooms").update({ status: "deleted" }).eq("id", id);
      if (error) throw error;
    } else if (act === "restore") {
      const { error } = await supabase.from("rooms").update({ status: "open" }).eq("id", id);
      if (error) throw error;
    } else if (act === "purge") {
      if (!confirm("이 모임을 영구 삭제할까요? 참여자 정보까지 완전히 사라지며 되돌릴 수 없습니다.")) { b.disabled = false; return; }
      const { error } = await supabase.from("rooms").delete().eq("id", id);
      if (error) throw error;
      await supabase.from("room_joins").delete().eq("room_id", id);
      await supabase.from("room_interests").delete().eq("room_id", id);
    }
    await refresh();
  } catch (_) { showToast("처리 실패 — 다시 시도해 주세요.", "error"); b.disabled = false; }
});

// ── 새 모임 만들기 ──
$("new-btn").addEventListener("click", () => {
  const root = $("modal-root");
  root.innerHTML = `<div class="modal-bg"><div class="modal">
    <h3>새 모임 만들기</h3>
    <div class="fld"><label>제목 *</label><input id="f-title" maxlength="60" placeholder="예: 농구하자 / 그랩 같이 타실 분 / 쇼핑 가요"></div>
    <div class="fld"><label>장소</label><input id="f-place" maxlength="60" placeholder="예: LCIC 농구장, SM몰 등"></div>
    <div class="fld"><div class="row">
      <div><label>날짜</label><input id="f-date" type="date"></div>
      <div><label>시간 (선택)</label><input id="f-time" type="time"></div>
    </div></div>
    <div class="fld"><label>정원 (비우면 제한 없음)</label><input id="f-cap" type="number" min="1" max="999" placeholder="예: 10"></div>
    <div class="fld"><label>한줄 설명 (선택)</label><textarea id="f-note" maxlength="200" placeholder="자유롭게 남겨주세요"></textarea></div>
    <div class="fld"><label>오픈채팅방 링크 (선택)</label><input id="f-chat" maxlength="200" placeholder="https://open.kakao.com/o/..."></div>
    ${ADMIN ? `<div class="fld"><label class="chk-label"><input type="checkbox" id="f-official" checked> 🏫 운영진 공식 모임으로 등록</label></div>` : ""}
    <div class="modal-actions">
      <button class="btn ghost" id="m-cancel">취소</button>
      <button class="btn join" id="m-create">만들기</button>
    </div>
  </div></div>`;
  $("f-date").value = todayStr();   // 날짜 기본값: 오늘 (시간은 자동입력 안 함 — 약속 시간은 직접 선택)
  const close = () => (root.innerHTML = "");
  root.querySelector(".modal-bg").onclick = (ev) => { if (ev.target.classList.contains("modal-bg")) close(); };
  $("m-cancel").onclick = close;
  $("m-create").onclick = async () => {
    const title = $("f-title").value.trim();
    if (!title) { showToast("제목을 입력해 주세요.", "error"); return; }
    const capRaw = parseInt($("f-cap").value, 10);
    const official = ADMIN && $("f-official") ? $("f-official").checked : false;
    const room = {
      id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)),
      host_id: ME ? ME.id : "official", host_name: ME ? ME.n : "LCIC 운영진", title,
      place: $("f-place").value.trim() || null,
      event_date: $("f-date").value || null,
      event_time: $("f-time").value || null,
      capacity: isNaN(capRaw) || capRaw <= 0 ? null : capRaw,
      note: $("f-note").value.trim() || null,
      chat_url: $("f-chat").value.trim() || null,
      official,
      status: "open",
    };
    $("m-create").disabled = true;
    try {
      const r1 = await supabase.from("rooms").insert(room);
      if (r1.error) throw r1.error;
      if (ME) await supabase.from("room_joins").upsert({ room_id: room.id, student_id: ME.id, name: ME.n });   // 주최자 자동 참여(학생만)
      close(); showToast("모임을 만들었어요!", "success"); await refresh();
    } catch (_) { $("m-create").disabled = false; showToast("생성 실패 — 다시 시도해 주세요.", "error"); }
  };
  setTimeout(() => $("f-title").focus(), 60);
});

async function refresh() { try { await load(); render(); } catch (_) { showToast("불러오기 실패(관리자 SQL 필요).", "error"); } }

(async function () {
  const ok = await initIdentity();
  if (!ok) { $("gate").classList.remove("hidden"); return; }
  $("app").classList.remove("hidden");
  if (ADMIN) $("sub").textContent = "관리자 보기 — 조회·삭제·운영진 공식 모임 개설";
  await refresh();
  setInterval(refresh, 15000);
})();
</script>
</body>
</html>
